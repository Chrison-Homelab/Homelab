# app-catalogue.yaml — the hand-curated allowlist of known community-scripts apps.
#
# This is the language-neutral source-of-truth that maps each KNOWN `spec.app`
# slug to its community-scripts metadata. It is consumed by BOTH sides of the
# BL-013 create path:
#
#   * the PowerShell renderer (Deploy-Shape.ps1) — SOFT validation: an unknown
#     slug warns (and only errors under -Strict). Ad-hoc slugs still deploy:
#     this is an allowlist for guidance, not a hard gate — the escape hatch is
#     deliberate (community-scripts ships hundreds of ct/<app>.sh scripts).
#
#   * the C# converge engine (Infrastructure/engine) — provisioner dispatch +
#     drift guard. A test (AppCatalogueTests) asserts every app slug hardcoded
#     in ProvisionerRegistry.Default() appears here, keeping the two in sync.
#
# Field reference (per entry):
#   key            the `spec.app` value authored in a shape.
#   script         the community-scripts ct/<script>.sh slug (usually == key).
#   channel        optional default source channel: 'stable' (ProxmoxVE) or
#                  'dev' (ProxmoxVED). Omit to let the shape/renderer default
#                  to 'stable'. A shape's own spec.source still overrides this.
#   repo           optional explicit repo override (e.g. a fork). Omit to derive
#                  from channel (stable→community-scripts/ProxmoxVE,
#                  dev→community-scripts/ProxmoxVED).
#   ref            optional git ref. Omit to default to 'main'.
#   provisioner    optional post-create provisioner name (matches IAppProvisioner
#                  .App in the engine). Omit/null = no post-create config; the
#                  engine's DefaultProvisioner handles it (create only).
#
# Keep entries minimal and accurate — only add a slug once it is actually used
# by a committed shape or known to the engine. Do not invent slugs.

apps:
  # Generic Docker host — used by the ServArr example shape (ct/docker.sh).
  # No post-create provisioner: community-scripts installs Docker, the stack's
  # compose is layered on separately.
  docker:
    script: docker

  # Plain base Debian CT (ct/debian.sh) — no app at all. The building block for a shape
  # whose `provisioner:` does the whole install itself, because community-scripts has no
  # script for what it is: `pangolin` (Docker EE, installed by its provisioner) and
  # `shell` (a tmux host) both create with this. No provisioner of its own — a bare
  # debian: entry is create-only.
  debian:
    script: debian

  # Rootless Podman + quadlet host (ADR-0009 / #284). ct/podman.sh installs Podman
  # (rootful, with a root podman.socket + Portainer prompts we decline), then the
  # `podman` provisioner converts it to the rootless quadlet-native model: masks the
  # socket, adds the non-root user with an in-map subuid range + linger, renders the
  # stack's quadlet files and drives `systemctl --user`.
  podman:
    script: podman
    provisioner: podman

  # Forgejo (Git forge) — has a post-create provisioner that sets ROOT_URL.
  forgejo:
    script: forgejo
    provisioner: forgejo

  # Forgejo Actions runner — registers against a forgejo dependency post-create.
  forgejo-runner:
    script: forgejo-runner
    provisioner: forgejo-runner

  # GitHub Actions self-hosted runner — registers to a GitHub org post-create.
  github-runner:
    script: github-runner
    provisioner: github-runner

  # Cloudflare Tunnel connector — ensures tunnel + DNS (ADD-ONLY) post-create.
  cloudflared:
    script: cloudflared
    provisioner: cloudflared

  # ── Media stack (*arr rebuild — ADR-0006 / plan #105). No post-create
  # provisioners yet; create-only via community-scripts. /data + app config
  # are handled by the shared-mount model + cutover, not the catalogue.
  prowlarr:
    script: prowlarr
    provisioner: prowlarr       # arr-wire: indexer carry-over + FlareSolverr proxy (#159)
  sonarr:
    script: sonarr
    provisioner: sonarr         # arr-wire: root folder + qbit client + self-register (#159)
  radarr:
    script: radarr
    provisioner: radarr         # arr-wire: root folder + qbit client + self-register (#159)
  bazarr:
    script: bazarr
    provisioner: bazarr         # arr-wire: connect to sonarr/radarr + Forms auth (#178)
  qbittorrent:
    script: qbittorrent
    provisioner: qbittorrent   # arr-wire: WebUI creds + categories + save path (#159)
  seerr:
    script: seerr            # merged Overseerr/Jellyseerr successor (ct/seerr.sh)
    provisioner: seerr       # wire sonarr/radarr request targets via the Seerr API (after the manual Plex wizard)
  flaresolverr:
    script: flaresolverr
  cross-seed:
    script: cross-seed           # net-new (#178)
    provisioner: cross-seed      # render config.js (torznab ← prowlarr, inject → qbittorrent) + restart daemon
  plex:
    script: plex                 # ADOPTED CT 5008 — the create path never runs for it (the shape is an
                                 # update-only adoption; see stacks/Media/plex.lxc.yaml). Listed because the
                                 # slug is authored in a shape and now has a provisioner.
    provisioner: plex            # reconcile server settings via the /:/prefs API, add/update only (#332).
                                 # Pins the deliberate non-default TranscoderCanOnlyRemuxVideo=1, which a
                                 # rebuild would otherwise silently reset to Plex's default.
  tracearr:
    script: tracearr             # net-new; Plex/Jellyfin/Emby session monitoring (Tautulli replacement). No
                                 # provisioner — all-in-one install self-generates secrets; Plex link is a UI step.
  shelfmark:
    script: shelfmark            # net-new; book search/request hub (calibrain)
    provisioner: shelfmark       # upsert /etc/shelfmark/.env: Prowlarr (live) + Hardcover metadata + ABS nav link
  audiobookshelf:
    script: audiobookshelf       # net-new; audiobook/podcast server (native apps). No provisioner (libraries via UI).
  romm:
    script: romm                 # net-new; ROM/emulation library (MariaDB + Angie, in-browser EmulatorJS). No provisioner (admin acct + library via UI).

  # Pangolin — SSO remote-access reverse proxy, the Teleport replacement (ADR-0007).
  # Runs as Docker ENTERPRISE EDITION (fosrl/pangolin:ee — OIDC/RBAC need the EE
  # license, which only ships on the Docker image; the native community-scripts
  # install is OSS-only and can't activate a license — see #168). So the CT is a
  # Docker host (script: docker → ct/docker.sh) and the `pangolin` provisioner
  # renders the compose (pangolin/gerbil/traefik) + config + Traefik (DNS-01 wildcard
  # certs for the public-ingress model) and brings the stack up. See
  # stacks/Core/pangolin.lxc.yaml.
  pangolin:
    script: docker
    provisioner: pangolin

  # Shell host — a CT that exists only to run a long-lived tmux server you attach to
  # from any laptop (#404). There is no community-scripts app for "a terminal", so the
  # CT is a plain base Debian (script: debian → ct/debian.sh) and the `shell`
  # provisioner does all of it: tmux + CLI kit, the login user and its authorized_keys,
  # the canonical ~/.tmux.conf and the rio terminfo (#405), TPM's plugins, and a systemd
  # unit that brings the session back after a reboot (#408). See
  # stacks/DevOps/shell.lxc.yaml.
  shell:
    script: debian
    provisioner: shell

  # Newt — Pangolin's WireGuard site connector (#441). Gives a stack its own Pangolin SITE, so
  # the stack's exposure travels with the stack (the per-stack model, #442). Plain base Debian
  # (script: debian) + the `newt` provisioner, which installs the release BINARY as a root
  # systemd service — deliberately NOT a container: Pangolin SSH resources require Newt as root
  # on the host and upstream does not support the containerized form for SSH mode (a narrow,
  # documented exception to ADR-0009). See stacks/DevOps/newt.lxc.yaml.
  newt:
    script: debian
    provisioner: newt

  # InvenTree — the parts inventory (#508). ct/inventree.sh installs the packager.io
  # deb and runs the migrations, but leaves two things a fresh install cannot use:
  # `site_url` points at the CT's DHCP address, and there is NO superuser, so nothing
  # can log in or mint an API token. The `inventree` provisioner closes both.
  #
  # NOTE the OS constraint travels with this entry: the install script hard-requires
  # Ubuntu (`grep -qE "^ID=(ubuntu)$"`), so a shape using it must set os: ubuntu.
  # See stacks/Workshop/inventree.lxc.yaml.
  inventree:
    script: inventree
    provisioner: inventree
