# Proxmox host — described, not provisioned via API (it hosts the LXCs/VMs).
# Reconciled against discovery (docs/discovered-state.json) 2026-05-31. The LXCs
# /VMs it hosts are their own shapes, not listed here. See ../README.md.

apiVersion: homelab/v1
kind: Node

metadata:
  name: desktop-01
  tags: [proxmox, host, gaming-pc]

spec:
  hardware: Gaming PC                # discovered 2026-05-29
  cpu: AMD Ryzen 5 3600              # 6 cores / 12 threads
  cores: 6
  memory: 16384               # MB
  pveVersion: "9.2.2"
  boot: legacy-bios
  storages: [local, local-lvm, ds1813-nfs-volume-1, ds1813-nfs-volume-2, ds1813-nfs-volume-3]  # local-lvm ~1.8 TB
  network:                      # reconciled from discovery 2026-05-31
    bridge: vmbr0
    address: 10.0.0.12/16       # mgmt on VLAN 1000 (Network Devices) — migrated 2026-08-02, #37.
                                # Carried on a TAGGED sub-interface vmbr0.1000; vmbr0 itself is
                                # `inet manual` so untagged guests keep reaching the Old Network.
    uplink: eno1
    # wlp8s0 (onboard WiFi) present but unused
