# Proxmox host — described, not provisioned via API (it hosts the LXCs/VMs).
# Specs are TODO: confirmed by Phase 2 discovery against the live cluster,
# not guessed. See ../README.md.

apiVersion: homelab/v1
kind: Node

metadata:
  name: nuc-01
  tags: [proxmox, host]

spec:
  hardware: Intel NUC D34010WYK      # discovered 2026-05-29
  cpu: Intel i3-4010U @ 1.7GHz       # 2 cores / 4 threads
  cores: 2
  memory: 16384               # MB
  pveVersion: "9.2.2"
  boot: uefi
  storages: [local, local-lvm]
  # network: TODO — bridges / VLAN-aware config not yet captured
