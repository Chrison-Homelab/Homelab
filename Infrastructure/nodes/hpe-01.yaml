# Proxmox host — described, not provisioned via API (it hosts the LXCs/VMs).
# Reconciled against discovery (docs/discovered-state.json) 2026-05-31. The LXCs
# /VMs it hosts are their own shapes, not listed here. See ../README.md.

apiVersion: homelab/v1
kind: Node

metadata:
  name: hpe-01
  tags: [proxmox, host]

spec:
  hardware: HP EliteDesk 800 G2 DM   # discovered 2026-05-29
  cpu: Intel i5-6500T @ 2.5GHz
  cores: 4
  memory: 16384               # MB
  pveVersion: "9.2.2"
  boot: uefi
  storages: [local, local-lvm, ds1813-nfs-volume-1, ds1813-nfs-volume-2, ds1813-nfs-volume-3]
  network:                      # reconciled from discovery 2026-05-31
    bridge: vmbr0
    address: 10.0.0.13/16       # mgmt on VLAN 1000 (Network Devices) — migrated 2026-08-02, #37.
                                # Carried on a TAGGED sub-interface vmbr0.1000; vmbr0 itself is
                                # `inet manual` so untagged guests keep reaching the Old Network.
    uplink: eno1
