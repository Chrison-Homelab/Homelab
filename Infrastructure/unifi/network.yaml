# UniFi network desired-state (#221 / #102) — reconciled by `homelab-infra
# converge-unifi` via UnifiSharp's legacy write adapter (the official integration
# API can't write these yet; see ADR-0003). ADD-ONLY: converge creates declared
# resources that are missing (matched by name) and never deletes hand-managed
# ones — same guardrail as the Cloudflare reconcile (CLAUDE.md).
#
# Declared resources are RECONCILED, not merely created (#416). A rule that exists
# but no longer matches this file is corrected, and the diff is printed. It used to
# stop at "is a rule with this name present?", so re-pointing the forward target in
# the UI left this file and the controller disagreeing while converge reported
# success indefinitely — the same write-once failure the CF Access bypass had (#417).
#
# Auth (env): UNIFI_API_KEY + UNIFI_LOCAL_HOST — what `secrets.env` actually carries,
#             and enough on its own (the site URL is derived from the host). Session
#             auth (UNIFI_LEGACY_BASE_URL + UNIFI_USERNAME + UNIFI_PASSWORD) still
#             works and is what the .containers/unifi test controller needs.
#             UNIFI_VERIFY_TLS=false for the console's self-signed cert.
# Validate the reconcile read-only with `converge-unifi <file>`; `--apply` writes.
#
# TWO KINDS OF LOCAL DNS, two homes — they are different endpoints, not a style choice:
#   * `staticDns` BELOW — zone-level records on the controller's v2 site API. They belong
#     to no single guest, so they live here.
#   * `network.reservation.localDnsRecord` ON THE GUEST SHAPE — a PER-CLIENT record
#     attached to a DHCP reservation, which converge can only write after reading that
#     guest's live MAC (#416). `homelab-infra unifi-reservations stacks` audits those.
# A name served one way cannot be managed from the other.
#
# DHCP RESERVATIONS ARE NOT DECLARED HERE either, for the same reason — see above.
apiVersion: homelab/v1
kind: UnifiNetwork

metadata:
  name: homelab-ingress

spec:
  # WAN :443 → Pangolin Traefik (CT 2013, 10.10.0.13). This is the public-ingress
  # port-forward that ADR-0007 stood up by hand; codifying it here makes a
  # bare-metal rebuild restore it. Pairs with the grey-cloud *.lab/*.arr A records
  # (PR #223) — DNS points the hostnames at the home WAN IP, this forwards :443 in.
  portForwards:
    - name: pangolin-https
      enabled: true
      interface: wan            # the WAN the rule binds to (wan | wan2 | both)
      source: any               # permitted source — 'any' or a CIDR/IP
      destinationPort: "443"    # WAN port
      forwardIp: 10.10.0.13      # Pangolin CT (ctid 2013)
      forwardPort: "443"
      protocol: tcp
      log: false

  # Controller-local DNS (#419). The three Pangolin-fronted zones are grey-cloud A records
  # at Cloudflare pointing to the home WAN IP, so INSIDE the house they resolved to the WAN
  # too and every admin UI was reached by NAT hairpin back through the port-forward above.
  # That made the forward load-bearing for LAN access, not just remote access — so ADR-0007's
  # "reversible exit" of closing :443 would have taken the whole admin surface down at home.
  # These three records answer locally with Traefik's real address, which decouples the two.
  #
  # WILDCARDS, not ~16 individual records: the controller supports them and matches arbitrary
  # labels (verified — the Azure Lab's `*.topaz.local.dev` answers any label under it). A new
  # Pangolin resource therefore needs no DNS work at all.
  #
  # ⚠ Deliberately NOT overridden here:
  #   - pangolin.chrison.dev itself — orange-clouded, rides the Core CF tunnel. Resources
  #     bounce through it for the SSO gate, and pointing it at Traefik locally would take
  #     that redirect off the tunnel it is served by.
  #   - vpn.chrison.dev — also a WAN A record, but a VPN endpoint has to resolve to the WAN
  #     address from inside the house as well, or the client dials its own LAN.
  #   - Everything else in the zone is an orange-cloud CNAME to a tunnel; a local override
  #     would bypass Cloudflare Access on the break-glass hostnames.
  #
  # Let's Encrypt is unaffected: the wildcards use DNS-01, which needs no inbound path.
  #
  # ── TLS, for the internal names below (#314, decided 2026-08-16) ────────────────────
  # Internal services are PLAIN HTTP and stay that way. `.internal` is not a real TLD so
  # Let's Encrypt cannot issue for it, and the alternative — an internal CA — was ruled
  # out deliberately: none of the clients are enrolled in anything, so its root would have
  # to be installed by hand on every device, and a root nobody trusts is worse than no TLS
  # at all. These records exist to make internal communication addressable by name, not to
  # secure it. (The Azure emulator's own self-signed `*.topaz.local.dev` cert is a
  # per-service exception you trust once — see stacks/Azure/stack/README.md — not a lab CA.)
  #
  # ── EVERY record on the controller is declared here ─────────────────────────────────
  # Audited 2026-08-16 by resolving each record's target against live Proxmox + UniFi
  # state rather than reading its name: all 20 point at our own guests or nodes. There is
  # no third-party or unexplained record on this controller. `converge-unifi` lists
  # anything undeclared, so that stays true without anyone checking.
  staticDns:
    # ── Core: Pangolin / Traefik (CT 2013) ──
    - { name: "*.lab.chrison.dev", value: 10.10.0.13 }
    - { name: "*.arr.chrison.dev", value: 10.10.0.13 }
    - { name: "*.iot.chrison.dev", value: 10.10.0.13 }

    # ── The Proxmox nodes ──
    # ⚠ This is the ONE place in the repo their addresses are written down, and it is
    # deliberate. CLAUDE.md says nothing should hard-code 10.0.0.11/.12/.13 precisely so a
    # re-address is a single edit — that rule is about CONSUMERS, which reach nodes by
    # name. The name→address mapping has to exist somewhere; before this it existed only
    # as three records clicked into the controller. Re-addressing a node is now: edit the
    # line, converge. secrets.env's PROXMOX_BASE_URL resolves through these names.
    - { name: nuc-01.homelab.chrison.internal,     value: 10.0.0.11 }
    - { name: desktop-01.homelab.chrison.internal, value: 10.0.0.12 }
    - { name: hpe-01.homelab.chrison.internal,     value: 10.0.0.13 }

    # ── SmartHome ──
    # homeassistant: the hub, CT 6005 on its Homelab leg. NOTE the same host also answers
    # `homeassistant.iot.chrison.internal`, which is a PER-CLIENT record on its DHCP
    # reservation (a different endpoint — see homeassistant.lxc.yaml). Two names, two
    # mechanisms, one address; both are declared, neither is redundant enough to drop
    # without checking what points at which.
    - { name: homeassistant.homelab.chrison.internal, value: 10.10.0.21 }
    # smarthome: the stack's rootless podman host, CT 6004, on the IoT VLAN.
    - { name: smarthome.homelab.chrison.internal,     value: 10.40.207.170 }

    # ── Azure Lab: the Topaz emulator, CT 2009 on desktop-01 (VLAN 1050) ──
    # Azure SDK clients derive endpoint hostnames from the service name, so the emulator
    # needs a name per service family rather than one wildcard — and Key Vault's authorizer
    # rejects any host not ending in `.vault.topaz.local.dev`, so the deep names are load
    # bearing, not cosmetic. stacks/Azure/stack/README.md documented creating these BY HAND
    # as a one-time step ("yours to run"); this replaces that step.
    # They live here rather than in the Azure submodule because staticDns is a property of
    # the UnifiNetwork shape, which is superproject-global.
    - { name: topaz.local.dev,                       value: 10.50.0.10 }
    - { name: "*.topaz.local.dev",                   value: 10.50.0.10 }
    - { name: "*.storage.topaz.local.dev",           value: 10.50.0.10 }
    - { name: "*.blob.storage.topaz.local.dev",      value: 10.50.0.10 }
    - { name: "*.table.storage.topaz.local.dev",     value: 10.50.0.10 }
    - { name: "*.queue.storage.topaz.local.dev",     value: 10.50.0.10 }
    - { name: "*.file.storage.topaz.local.dev",      value: 10.50.0.10 }
    - { name: "*.vault.topaz.local.dev",             value: 10.50.0.10 }
    - { name: "*.keyvault.topaz.local.dev",          value: 10.50.0.10 }
    - { name: "*.servicebus.topaz.local.dev",        value: 10.50.0.10 }
    - { name: "*.eventhub.topaz.local.dev",          value: 10.50.0.10 }
    - { name: "*.cr.topaz.local.dev",                value: 10.50.0.10 }
