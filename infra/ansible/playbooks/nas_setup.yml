---
# NAS Setup and Testing Playbook
#
# Description: Tests connectivity to Synology DSM and retrieves system information
#
# Requirements:
#   - community.synology collection
#   - Install: ansible-galaxy collection install community.synology
#
# Usage:
#   ansible-playbook -i ../inventory.yml nas_setup.yml
#
# Purpose:
#   - Verify DSM API is reachable
#   - Test authentication
#   - Retrieve and display DSM system information

- name: Test DSM Setup
  hosts: nas
  gather_facts: false
  tasks:
    - name: Check DSM is reachable
      uri:
        url: "http://{{ dsm_host }}/webapi/entry.cgi"
        method: GET
        return_content: yes
      register: dsm_response

    - name: Assert DSM responded successfully
      assert:
        that:
          - dsm_response.status == 200
          - "'DSM' in dsm_response.content"

    - name: Get DSM info
      community.general.synology_dsm_info:
        host: "{{ dsm_host }}"
        username: "{{ dsm_user }}"
        password: "{{ dsm_password }}"
      register: dsm_info

    - debug:
        var: dsm_info