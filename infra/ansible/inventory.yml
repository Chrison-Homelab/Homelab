---
# Ansible Inventory for Homelab Infrastructure
# 
# This inventory is configured for development/testing with the containerized DSM
# in containers/dsm/
#
# For production use:
# 1. Update ansible_host and ansible_port for your actual NAS
# 2. Update credentials in group_vars/nas.yml (use ansible-vault for production)
# 3. Test connectivity: ansible -i inventory.yml nas -m ping

all:
  hosts:
    nas:
      ansible_host: localhost
      ansible_port: 5000
      ansible_connection: local