# Monitoring stack — the homelab's observability host (#222, #303).
#
# ONE member: `podman-host` (CT 4001), a rootless-podman host on hpe-01 running the
# observability fleet as quadlets — Prometheus, Grafana, Alertmanager, the OTel pipeline
# (collector → Tempo/Loki), snmp_exporter, exportarr, podman-exporter, unpoller and Pulse.
#
# Deliberately NOT co-located with any other stack: this host watches everything else, so it
# needs its own lifecycle and can migrate or resize independently.
#
# Config is NOT baked into the guest. The tree under `podman-host/assets/` is rendered onto
# the host before any unit starts (ADR-0009 `config.assets`), and its contents are folded into
# the managed marker, so editing a config re-converges and restarts the units that consume it.
#
# Alerting flows Prometheus rules → Alertmanager → receivers (ADR-0011). Alertmanager is the
# bus; Home Assistant is one receiver, not the destination every producer knows about.
#
# HISTORY: this stack was a single Docker LXC (CT 4000) driven by a compose file and a
# scripted deploy/install.sh. That generation was superseded by CT 4001 (#303) and its
# remains — compose.yml, deploy/, config/sample.*, grafana/, secrets.env.local.template and
# the CT 4000 shape — were deleted once CT 4000 was destroyed. Look in git history, not here.
#
# Validate members against ../../Infrastructure/schema/shape.schema.json.
# CTID allocation policy: members set ctid EXPLICITLY (omission is an error).

apiVersion: homelab/v1
kind: Stack

metadata:
  name: Monitoring
  tags: [monitoring, observability, infra]

spec:
  ctidRange:
    start: 4000           # guard rail: a dedicated observability block, clear of
    end: 4099             # Core (2010–2099) and Media (5100–5199).
  defaults:
    node: hpe-01          # always-on sentinel — suits a monitoring host
    source:
      channel: stable     # → community-scripts/ProxmoxVE (ct/docker.sh)
      ref: main
    os: debian
    osVersion: 13
    unprivileged: true
    storage: local-lvm
    templateStorage: local
    onboot: true
    network:
      bridge: vmbr0
      vlan: 1010          # Homelab — real tag → interface name=vlan1010,tag=1010
      ipv6: none
    timezone: Pacific/Auckland
    tags: [monitoring, observability, community-script]
