apiVersion: 1

datasources:
  # Stable uids — the provisioned dashboards reference datasources by uid
  # (node-power.json pins uid "prometheus"). Without these, Grafana assigns a
  # random uid and every panel renders empty ("datasource not found").
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  # Traces + logs from the OTel collector (PowerOrchestrator / #191).
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  # Alert bus (ADR-0011). Read-only-ish view onto Alertmanager so Grafana's Alerting UI can
  # list firing alerts and — the useful part — create SILENCES during maintenance without
  # touching rule definitions. handleGrafanaManagedAlerts is explicitly false: Grafana has no
  # managed rules any more, and forwarding would put two Alertmanagers in the path.
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
