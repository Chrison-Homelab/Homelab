# Alert bus (ADR-0011). Prometheus evaluates the rules and hands firing alerts to
# Alertmanager, which owns grouping, inhibition, silences and delivery. Nothing here
# knows that Home Assistant is on the far end.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Synology NAS via SNMP. Prometheus scrapes the snmp_exporter, passing the NAS
  # as ?target=; the exporter does the SNMP walk (module 'synology' in snmp.yml,
  # community 'homelab'). The relabel rewrites the scrape address to the exporter
  # while keeping the NAS as the target/instance — the standard snmp_exporter
  # pattern (without it, prometheus would try to scrape the NAS directly).
  - job_name: 'synology'
    metrics_path: /snmp
    params:
      # new-format snmp_exporter: auth name (from snmp.yml `auths:`) + modules.
      auth: [synology]
      module: [if_mib, synology]
    static_configs:
      # DS1813 NAS (SNMP v2c, community 'homelab'). Addressed BY NAME, not by IP:
      # the NAS moved 192.168.179.11 -> 10.0.0.10 (VLAN 1000) on 2026-08-02 and this
      # target was the one thing that broke, because it was the last hard-coded copy
      # of the old address outside the storage layer (#37, #340).
      - targets: ['nas.homelab.chrison.internal']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp_exporter:9116
  # *arr apps via exportarr (one instance per app, /metrics). 'app' label lets
  # dashboards split radarr/sonarr/prowlarr.
  - job_name: 'exportarr'
    metrics_path: /metrics
    static_configs:
      - targets: ['exportarr-radarr:9708']
        labels: { app: radarr }
      - targets: ['exportarr-sonarr:9709']
        labels: { app: sonarr }
      - targets: ['exportarr-prowlarr:9710']
        labels: { app: prowlarr }
  # UniFi gear via unpoller — gateway, switches and APs. One target: unpoller polls the
  # controller itself and exposes every device, radio, port and client as labelled series,
  # so there is nothing per-device to enumerate here (unlike the SNMP job above).
  - job_name: 'unifi'
    static_configs:
      - targets: ['unpoller:9130']

  # PowerOrchestrator metrics, re-exported by the OTel collector (#191).
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # Rootless podman hosts (ADR-0009 phase 3). Container/pod/image metrics from
  # prometheus-podman-exporter on each host. The Monitoring host is scraped by container
  # name over the shared quadlet network; the Media host by its internal DNS name (reserved + registered in UniFi, so no IP is
  # hard-coded here either).
  #
  # The SmartHome host (CT 6004) is deliberately ABSENT: it lives on the IoT VLAN 1040,
  # which is firewalled off from 1010, so Prometheus cannot reach it. Verified — a TCP probe
  # from CT 4001 to that host fails. Adding it needs a narrow UniFi allowance (1010 -> 1040
  # on :9882), which is a deliberate loosening of the IoT VLAN's isolation and therefore an
  # owner decision, not an implementation detail.
  - job_name: 'podman'
    static_configs:
      - targets: ['podman-exporter:9882']
        labels: { host: 'monitoring-podman-host', ctid: '4001' }
      - targets: ['media.homelab.chrison.internal:9882']
        labels: { host: 'media-podman-host', ctid: '5114' }

  # Proxmox cluster (#591) — TWO JOBS, and the split is load-bearing.
  #
  # `pve_up` is CLUSTER-WIDE: ask any node and you get all 46 guests. But
  # `pve_onboot_status` is NODE-SCOPED — the exporter reads it from the target node's own
  # guest configs, so asking hpe-01 returns only hpe-01's guests.
  #
  # Scraping one node therefore gave onboot for 28 guests and none for nuc-01's 6, which
  # meant ProxmoxGuestDown could never fire for anything on nuc-01 — including lxc/2013,
  # Pangolin, the public ingress. The `and on(id) pve_onboot_status == 1` join simply had
  # nothing to match, so the rule evaluated green and returned nothing, which is
  # indistinguishable from a healthy cluster.
  #
  # So: cluster-wide metrics come from ONE node (no duplicates), and onboot is collected
  # from EVERY node, with each job dropping what the other owns.
  #
  # desktop-01 is deliberately absent: it auto-sleeps, scraping it would fail, and its
  # guests carry onboot=0 so they are excluded from the rule anyway.
  - job_name: 'pve'
    metrics_path: /pve
    params:
      cluster: ['1']
    static_configs:
      - targets: ['hpe-01.homelab.chrison.internal']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'pve-exporter:9221'
    metric_relabel_configs:
      # onboot belongs to the per-node job below; keeping it here too would double the
      # series and turn the rule's join into a many-to-many error.
      - source_labels: [__name__]
        regex: 'pve_onboot_status'
        action: drop

  - job_name: 'pve-onboot'
    metrics_path: /pve
    params:
      node: ['1']
    static_configs:
      - targets:
          - 'hpe-01.homelab.chrison.internal'
          - 'nuc-01.homelab.chrison.internal'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'pve-exporter:9221'
    metric_relabel_configs:
      # Everything except onboot is cluster-wide and already collected above.
      - source_labels: [__name__]
        regex: 'pve_onboot_status'
        action: keep

  # ── Service probes (#591) ──────────────────────────────────────────────────────────
  # "Is the service answering", checked from outside the container. Replaces Pulse's
  # per-container alerting and goes further: it covers the Docker LXCs Beszel has no
  # per-container view of (Pangolin's ingress on CT 2013), and everything else declared
  # in the shapes' metadata.services.
  #
  # `criticality` decides severity in rules/services.rules.yml:
  #   critical -- the household or remote access notices within minutes, or alerting
  #               itself is impaired. Pages at priority 5.
  #   standard -- worth knowing, can wait. Normal priority.
  #
  # Kept in step with metadata.services BY HAND for now; rendering this list from the
  # shapes (as the Homepage dashboard already is) is the follow-up. Declared services
  # deliberately NOT probed, each needing a decision rather than an alert:
  #   Forgejo   -- forgejo.homelab.chrison.internal does not resolve; no such guest exists.
  #   Shell     -- shell.devops:8082 refuses connections.
  #   ESPHome   -- CT 6003 runs, but monitoring cannot reach the IoT VLAN on :6052
  #                (Home Assistant on the same VLAN is reachable).
  #   Cockpit   -- the host's own admin UI; rootless containers cannot reach the host IP.
  #   OTel/Prometheus -- already covered by `up` on their scrape jobs; Prometheus cannot
  #                usefully alert on itself being down.
  - job_name: 'blackbox'
    metrics_path: /probe
    scrape_interval: 1m
    static_configs:
      - labels: { module: http_public, criticality: critical, stack: core }
        targets:
          - 'Authentik=https://identity.chrison.dev'
          - 'Pangolin=https://pangolin.chrison.dev'
          - 'Traefik=https://traefik.lab.chrison.dev'
      - labels: { module: http_public, criticality: critical, stack: monitoring }
        targets:
          - 'ntfy=https://ntfy.lab.chrison.dev'
      - labels: { module: http_internal, criticality: critical, stack: monitoring }
        targets:
          - 'Alertmanager=http://alertmanager:9093/-/healthy'
      - labels: { module: http_internal, criticality: critical, stack: smarthome }
        targets:
          - 'Home Assistant=http://homeassistant.iot.chrison.internal:8123'
      - labels: { module: http_internal, criticality: critical, stack: media }
        targets:
          - 'Plex=http://plex.homelab.chrison.internal:32400/web'
          - 'Audiobookshelf=http://audiobookshelf.homelab.chrison.internal:13378'
          - 'Seerr=http://seerr.homelab.chrison.internal:5055'
      - labels: { module: http_internal, criticality: standard, stack: media }
        targets:
          - 'Bazarr=http://bazarr.homelab.chrison.internal:6767'
          - 'Maintainerr=http://media.homelab.chrison.internal:6246'
          - 'Prowlarr=http://prowlarr.homelab.chrison.internal:9696'
          - 'Radarr=http://radarr.homelab.chrison.internal:7878'
          - 'RomM=http://romm.homelab.chrison.internal'
          - 'Shelfmark=http://shelfmark.homelab.chrison.internal:8084'
          - 'Sonarr=http://sonarr.homelab.chrison.internal:8989'
          - 'Tracearr=http://tracearr.homelab.chrison.internal:3000'
          - 'Youtarr=http://media.homelab.chrison.internal:3087'
          - 'qBittorrent=http://qbittorrent.homelab.chrison.internal:8090'
      - labels: { module: http_internal, criticality: standard, stack: core }
        targets:
          - 'Proxmox Backup Server=https://pbs.homelab.chrison.internal:8007'
          - 'Power Orchestrator=http://nuc-01.homelab.chrison.internal:8080'
          - 'Proxmox=https://hpe-01.homelab.chrison.internal:8006'
          - 'Proxmox Datacenter Manager=https://10.10.208.155:8443'
      - labels: { module: http_internal, criticality: standard, stack: monitoring }
        targets:
          - 'Grafana=http://grafana:3000/api/health'
          - 'Homepage=http://homepage:3000'
    relabel_configs:
      # Targets are written `Name=url` so the alert can say "Plex is down" rather than
      # quoting a URL. Split them into the `name` label and the probed URL.
      - source_labels: [__address__]
        regex: '([^=]+)=(.+)'
        target_label: name
        replacement: '$1'
      - source_labels: [__address__]
        regex: '([^=]+)=(.+)'
        target_label: __param_target
        replacement: '$2'
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [module]
        target_label: __param_module
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'

  # OpenBao is a probe too, but alerts on its own terms: a SEALED vault is up and
  # answering (503), so "service down" is the wrong message for it.
  - job_name: 'openbao'
    metrics_path: /probe
    scrape_interval: 1m
    params:
      module: [openbao_health]
    static_configs:
      - targets: ['https://openbao.devops.chrison.internal:8200/v1/sys/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'
