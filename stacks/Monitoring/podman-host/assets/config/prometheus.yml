# Alert bus (ADR-0011). Prometheus evaluates the rules and hands firing alerts to
# Alertmanager, which owns grouping, inhibition, silences and delivery. Nothing here
# knows that Home Assistant is on the far end.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Synology NAS via SNMP. Prometheus scrapes the snmp_exporter, passing the NAS
  # as ?target=; the exporter does the SNMP walk (module 'synology' in snmp.yml,
  # community 'homelab'). The relabel rewrites the scrape address to the exporter
  # while keeping the NAS as the target/instance — the standard snmp_exporter
  # pattern (without it, prometheus would try to scrape the NAS directly).
  - job_name: 'synology'
    metrics_path: /snmp
    params:
      # new-format snmp_exporter: auth name (from snmp.yml `auths:`) + modules.
      auth: [synology]
      module: [if_mib, synology]
    static_configs:
      # DS1813 NAS (SNMP v2c, community 'homelab'). Addressed BY NAME, not by IP:
      # the NAS moved 192.168.179.11 -> 10.0.0.10 (VLAN 1000) on 2026-08-02 and this
      # target was the one thing that broke, because it was the last hard-coded copy
      # of the old address outside the storage layer (#37, #340).
      - targets: ['nas.homelab.chrison.internal']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp_exporter:9116
  # *arr apps via exportarr (one instance per app, /metrics). 'app' label lets
  # dashboards split radarr/sonarr/prowlarr.
  - job_name: 'exportarr'
    metrics_path: /metrics
    static_configs:
      - targets: ['exportarr-radarr:9708']
        labels: { app: radarr }
      - targets: ['exportarr-sonarr:9709']
        labels: { app: sonarr }
      - targets: ['exportarr-prowlarr:9710']
        labels: { app: prowlarr }
  # UniFi gear via unpoller — gateway, switches and APs. One target: unpoller polls the
  # controller itself and exposes every device, radio, port and client as labelled series,
  # so there is nothing per-device to enumerate here (unlike the SNMP job above).
  - job_name: 'unifi'
    static_configs:
      - targets: ['unpoller:9130']

  # PowerOrchestrator metrics, re-exported by the OTel collector (#191).
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # Rootless podman hosts (ADR-0009 phase 3). Container/pod/image metrics from
  # prometheus-podman-exporter on each host. The Monitoring host is scraped by container
  # name over the shared quadlet network; the Media host by its internal DNS name (reserved + registered in UniFi, so no IP is
  # hard-coded here either).
  #
  # The SmartHome host (CT 6004) is deliberately ABSENT: it lives on the IoT VLAN 1040,
  # which is firewalled off from 1010, so Prometheus cannot reach it. Verified — a TCP probe
  # from CT 4001 to that host fails. Adding it needs a narrow UniFi allowance (1010 -> 1040
  # on :9882), which is a deliberate loosening of the IoT VLAN's isolation and therefore an
  # owner decision, not an implementation detail.
  - job_name: 'podman'
    static_configs:
      - targets: ['podman-exporter:9882']
        labels: { host: 'monitoring-podman-host', ctid: '4001' }
      - targets: ['media.homelab.chrison.internal:9882']
        labels: { host: 'media-podman-host', ctid: '5114' }

  # Proxmox cluster (#591) — TWO JOBS, and the split is load-bearing.
  #
  # `pve_up` is CLUSTER-WIDE: ask any node and you get all 46 guests. But
  # `pve_onboot_status` is NODE-SCOPED — the exporter reads it from the target node's own
  # guest configs, so asking hpe-01 returns only hpe-01's guests.
  #
  # Scraping one node therefore gave onboot for 28 guests and none for nuc-01's 6, which
  # meant ProxmoxGuestDown could never fire for anything on nuc-01 — including lxc/2013,
  # Pangolin, the public ingress. The `and on(id) pve_onboot_status == 1` join simply had
  # nothing to match, so the rule evaluated green and returned nothing, which is
  # indistinguishable from a healthy cluster.
  #
  # So: cluster-wide metrics come from ONE node (no duplicates), and onboot is collected
  # from EVERY node, with each job dropping what the other owns.
  #
  # desktop-01 is deliberately absent: it auto-sleeps, scraping it would fail, and its
  # guests carry onboot=0 so they are excluded from the rule anyway.
  - job_name: 'pve'
    metrics_path: /pve
    params:
      cluster: ['1']
    static_configs:
      - targets: ['hpe-01.homelab.chrison.internal']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'pve-exporter:9221'
    metric_relabel_configs:
      # onboot belongs to the per-node job below; keeping it here too would double the
      # series and turn the rule's join into a many-to-many error.
      - source_labels: [__name__]
        regex: 'pve_onboot_status'
        action: drop

  - job_name: 'pve-onboot'
    metrics_path: /pve
    params:
      node: ['1']
    static_configs:
      - targets:
          - 'hpe-01.homelab.chrison.internal'
          - 'nuc-01.homelab.chrison.internal'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'pve-exporter:9221'
    metric_relabel_configs:
      # Everything except onboot is cluster-wide and already collected above.
      - source_labels: [__name__]
        regex: 'pve_onboot_status'
        action: keep
