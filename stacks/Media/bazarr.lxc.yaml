# Bazarr — subtitle automation for Sonarr/Radarr.
#
# community-scripts: ct/bazarr.sh (stable). Inherits node/os/network/storage/
# timezone from ./stack.yaml. Needs the same /data view as Sonarr/Radarr so it
# can read media + write sidecar subtitles next to each file.
# Validate against ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: bazarr
  stack: Media
  tags: [subtitles]

spec:
  app: bazarr
  ctid: 5103
  cores: 2
  memory: 1024           # MB
  disk: 8                # GB
  dependsOn: [sonarr, radarr]

  mounts:
    - type: nfs
      storage: ds1813-nfs-volume-4
      source: data
      target: /data
      acl: true
      backup: false
  hookscript: local:snippets/ensure-data-mount.sh

  # Subtitle config migrated from the old bazarr (CT 5006) — IaC + redeployable.
  # The provisioner applies: enabled providers, languages, the language profile (set
  # as the series/movies default), and opensubtitlescom settings. Provider creds are
  # NOT here — opensubtitlescom username/password come from secrets.env
  # (BAZARR_OPENSUBTITLES_USER / _PASSWORD). animetosho + yifysubtitles need no account.
  config:
    subtitles:
      providers: [opensubtitlescom, animetosho, yifysubtitles]
      languages: [en, zh, de]
      opensubtitlescom: { use_hash: true, include_ai_translated: true }
      profile:
        name: Standard Profile
        cutoff: 65535          # 65535 = "any" (no cutoff)
        items:
          - { language: en }
          - { language: zh, audio_only: true }
          - { language: de, audio_only: true }
