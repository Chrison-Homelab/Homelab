# qBittorrent — download client (the BL-016 recut of the old in-guest-NFS CT 5007).
#
# community-scripts: ct/qbittorrent.sh (stable). Inherits node/os/network/storage/
# timezone from ./stack.yaml. Writes downloads under /data/torrents on the SAME
# shared export the *arr apps import from → hardlink + instant-move, and never an
# in-guest mount (the CT 5007 rootfs-fill race is designed out here).
# Validate against ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: qbittorrent
  stack: Media
  tags: [downloads]

spec:
  app: qbittorrent
  ctid: 5104
  cores: 2
  memory: 2048           # MB — verification/hashing is the heaviest member
  disk: 8                # GB — app config only; downloads live on /data/torrents

  # Categories tv-sonarr / radarr and save paths under /data/torrents are app-level
  # config applied at cutover (no converge provisioner) — see ./README.md.
  mounts:
    - type: nfs
      storage: ds1813-nfs-volume-4
      source: data
      target: /data
      acl: true
      backup: false
    # LEGACY SEED LIBRARY on volume3 (#347). The old qBittorrent CT 5007 held 470 torrents
    # / 3.2 TB, and every one of its 471 fastresume files records an ABSOLUTE save_path
    # under /mnt/data — verified, zero exceptions. qBittorrent resumes a torrent by that
    # absolute path, so mounting volume3 here at the IDENTICAL path lets all of them carry
    # over with NO DATA MOVED and no 3.2 TB recheck.
    #
    # /mnt/data is deliberately NOT /data. Two distinct roots, on purpose:
    #   /data      volume4 — what the new *arr write into, the live library
    #   /mnt/data  volume3 — seed-only history inherited from CT 5007
    # Merging them would mean physically moving 3.2 TB between volumes for no benefit.
    #
    # This is also the real fix for #347's complaint: CT 5007 reached the NAS through its
    # OWN /etc/fstab with a hard-coded IP, invisible to converge and to MountReconciler.
    # Declaring it here makes it a host-level mountpoint the engine owns.
    - type: nfs
      storage: ds1813-nfs-volume-3
      source: data
      target: /mnt/data
      acl: true
      backup: false
  hookscript: local:snippets/ensure-data-mount.sh
