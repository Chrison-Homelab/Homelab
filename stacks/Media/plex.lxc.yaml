# Plex — media server. ADOPTED, NOT REBUILT.
#
# Unlike every other member of this stack, Plex is the PRE-EXISTING hand-built
# legacy CT 5008 (5000-block), kept "as-is" per ADR-0006 (§ "Plex stays as-is").
# We are NOT recreating it — we are bringing the ONE thing it needs from the new
# stack into IaC: read access to the shared volume4 media library that the *arr
# now write into. Converge treats this shape as an UPDATE-ONLY adoption:
#   - CommunityScriptsCreator.EnsureAsync  → NO-OP (CT 5008 already exists)
#   - CtConfigReconciler                   → only reconciles fields we DECLARE;
#       we deliberately OMIT cores/memory so Plex's resources are left untouched
#   - (no `plex` provisioner)              → no app-level provisioning runs
#   - MountReconciler                      → applies the mount + hookscript below
#
# ctid 5008 sits OUTSIDE this stack's 5100–5199 range ON PURPOSE: it's the adopted
# legacy member, not a new allocation. The range guard is for NEW members only.
#
# ── Library on NFS (read-only, minimal view) ─────────────────────────────────
# The *arr import into volume4 `data/media/{movies,tv}` (the shared /data export's
# `media/` subtree — see README "shared /data constraint"). Plex only ever READS
# the library, so we bind ONLY that subtree, read-only:
#     /mnt/pve/ds1813-nfs-volume-4/data/media  →  /data/media   (ro)
# Path mirrors the *arr (`/data/media/...`) so library paths line up across the
# stack; `ro=1` means Plex can never mutate the library; torrents/ stays invisible
# to Plex (it's a publicly-reachable consumer — same minimal-view stance as
# audiobookshelf). Same pre-start guard as the *arr: no NAS → refuse to start
# (closes the rootfs-fill race; see snippets/ensure-data-mount.sh).
#
# PARTIAL SYNC WITH LIVE: CT 5008 already carries the data/media mount at mp0 + this
#   hookscript (verified 2026-06-25, `pct config 5008`), so mp0 is a no-op. The NEW
#   youtube mount (mp1) is the one change converge applies — a single `pct set --mp1`.
#   MountReconciler renders mounts positionally (mp0=data/media, mp1=youtube) and
#   SEMANTICALLY compares, so mp0 matches live and only mp1 is set. It issues no
#   restart, so the running container is not bounced (the bind activates immediately
#   if Proxmox can hotplug it, else on Plex's next start). PRECONDITION: mp1 must be
#   free on the live CT — verified before apply so the `pct set` can't clobber an
#   existing mountpoint.
#
# NOT MANAGED by this adoption shape (left exactly as-is on the live CT): the iGPU
#   passthrough for transcoding (dev0 /dev/dri/renderD128, dev1 /dev/dri/card1),
#   the serial/tty lxc.mount.entry lines, and `features: mount=nfs` (required for the
#   bind). The reconcilers touch only mpN + hookscript + cores/memory/tags, so none of
#   the above is disturbed.
#
# SINGLE-HOMED since 2026-08-02 (#344). CT 5008 used to carry a second NIC — `net1`,
#   untagged, DHCP on the legacy 192.168.178.0/23 — left over from before the VLAN 1010
#   move. It was vestigial: nothing referenced 192.168.179.62, and it contributed a
#   *second* default route at the same metric as net0's, so outbound traffic could take
#   either gateway. Deleting it left the single default via 10.10.0.1 and changed nothing
#   else. The shape declares no NICs at all, so converge neither added nor removed it —
#   the deletion was a one-off `pct set 5008 --delete net1`.
# Validate against ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: plex
  stack: Media
  tags: [plex, media-server]

spec:
  app: plex
  ctid: 5008             # ADOPTED legacy CT (5000-block) — see header; not a new 51xx member.

  # Resources (#332). `cores` is now DECLARED, so CtConfigReconciler owns it; `memory`
  # stays omitted deliberately — see below.
  cores: 4               # was 2. hpe-01 has 4 physical cores and this is a cgroup CEILING,
                         # not a reservation, so an idle Plex costs nothing while a scan or
                         # an audio transcode can use the whole box instead of half of it.
  # memory: NOT declared — measured, not assumed. cgroup counters show peak 1.09 GB against
  # the 2 GB limit and `oom_kill 0` (never once), with Plex RSS ~54 MB idle. There is no
  # evidence 2 GB is short, so raising it would be cargo-cult. Revisit if oom_kill moves.
  disk: 16               # GB — grown 8→16 on 2026-08-01 (`pct resize 5008 rootfs 16G`, online).
                         # It was at 80% (1.6 GB free) with Metadata 1.1 GB and Cache 1.6 GB
                         # still growing; a full rootfs corrupts the Plex database. Now 40%.
                         # NOTE: `disk` is a CREATE-time var — nothing reconciles it, so this
                         # records intent for a rebuild. Growing is a manual, one-way op.

  # ── Server settings, now IaC (#332) ────────────────────────────────────────────────
  # These lived ONLY inside the container in Preferences.xml. A rebuild would have come
  # back with Plex defaults, silently changing playback behaviour. The `plex` provisioner
  # reconciles them through the /:/prefs API — add/update only, so any setting NOT listed
  # here is left exactly as Plex has it. Nothing is ever reset to default or removed.
  config:
    prefs:
      # THE IMPORTANT ONE. Label: "Disable video stream transcoding". Plex's default is
      # false; this box deliberately runs it true, so the server refuses video transcodes
      # and clients get direct play / remux / audio-only transcode instead. That is the
      # right call for a 4-core i5-6500T — and it is exactly what a rebuild would have
      # thrown away, letting a weak server start accepting 4K transcodes it cannot serve.
      TranscoderCanOnlyRemuxVideo: true
      # Matches Plex's default (on), pinned because it is load-bearing here: the iGPU is
      # passed into this CT specifically for it (dev0 /dev/dri/renderD128, dev1 card1).
      # Caveat worth knowing — the iGPU is Skylake HD 530, which only does HYBRID HEVC
      # 10-bit decode (full fixed-function arrived with Kaby Lake), and 228 of 264 4K
      # streams in this library are HEVC 10-bit. So this helps the h264 8-bit content and
      # the encode path; it is not a blanket 4K win.
      HardwareAcceleratedCodecs: true

  mounts:
    - type: nfs
      storage: ds1813-nfs-volume-4   # references the storage → ordered on activation
      source: data/media             # volume4 `data/media` subtree only (read-only consumer)
      target: /data/media            # mirrors the *arr's /data/media/{movies,tv}
      ro: true                       # Plex reads the library; never writes it
      acl: true                      # honor the export's setgid + default group ACLs
      backup: false                  # data lives on the NAS; keep out of vzdump
    # Youtarr's YouTube library (CT 5113 downloads to the volume4 `youtube` subpath).
    # Read-only consumer, like data/media — Plex serves it; Youtarr owns the writes.
    # MUST stay AFTER data/media: mounts render positionally, so data/media=mp0 (live,
    # no-op) and youtube=mp1 (the one new `pct set` this shape now issues).
    - type: nfs
      storage: ds1813-nfs-volume-4   # same export, different subpath
      source: youtube                # volume4 `youtube` subpath (≠ the shared /data tree)
      target: /data/youtube          # add a Plex library here (Other Videos / TV Shows)
      ro: true                       # Plex reads the library; Youtarr writes it
      acl: true                      # honor the export's setgid + default group ACLs
      backup: false                  # data lives on the NAS; keep out of vzdump
    # ── LEGACY volume-3 library (#329) ──────────────────────────────────────────────
    # 3.5 TB — 81% of what Plex serves. This was NOT declared here until #329: it reached
    # the container through a hand-written `/etc/fstab` line INSIDE CT 5008, so converge
    # could not see it, MountReconciler could not reconcile it and `validate` could not
    # catch it. Recreating this CT would have come up healthy and served 821 GB of 4.3 TB
    # — no error, just mostly-empty libraries.
    #
    # Not optional, and not merely "the old fleet's storage": EVERY Plex library depends
    # on it. Movies = /mnt/media/Movies + /data/media/movies, TV Shows likewise, and
    # **Animes (/mnt/media/Anime) exists ONLY here** with no volume-4 counterpart.
    #
    # `target` MUST stay exactly /mnt/media — Plex stores absolute section paths, so
    # changing it silently empties three libraries. MUST also stay LAST: mounts render
    # positionally (data/media=mp0, youtube=mp1, this=mp2) and inserting above would
    # renumber the live ones.
    #
    # Retiring volume-3 is a separate, much larger decision (#199): 3.2 TB of torrents
    # and 470 seeding entries on CT 5007 live there too.
    - type: nfs
      storage: ds1813-nfs-volume-3   # legacy 6 TB volume, 74% full
      source: data/media             # /volume3/Volume-3/data/media
      target: /mnt/media             # load-bearing — see above
      ro: true                       # Plex reads it; the OLD arr fleet still writes it
      acl: true                      # honor the export's setgid + default group ACLs
      backup: false                  # data lives on the NAS; keep out of vzdump
  hookscript: local:snippets/ensure-data-mount.sh   # pre-start guard: volume4 mounted or refuse to start
