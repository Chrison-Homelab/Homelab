# Prowlarr — indexer hub; syncs indexers to Sonarr/Radarr.
#
# community-scripts: ct/prowlarr.sh (stable). Inherits node/os/network/storage/
# timezone from ./stack.yaml. No /data — Prowlarr touches no media files.
# Cutover migrates the existing /var/lib/prowlarr config DB (indexers) — see README.
# Validate against ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: prowlarr
  stack: Media
  tags: [indexers]

spec:
  app: prowlarr
  ctid: 5100
  cores: 1
  memory: 1024           # MB
  disk: 4                # GB
  dependsOn: [flaresolverr, qbittorrent]   # flaresolverr: some indexers solve CF challenges; qbittorrent: Prowlarr's own download client (+ its `prowlarr` category)

  # arr-wire config migration (#159) — both ADD-ONLY, both idempotent (skip-by-name):
  config:
    migrateIndexersFrom: 5002   # OLD prowlarr CTID (same node) — clean API carry-over of indexers
    flaresolverr: flaresolverr  # ensure a FlareSolverr proxy → the new flaresolverr sibling (5107)
