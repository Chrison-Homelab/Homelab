# Cloudflared — dedicated Cloudflare Tunnel connector for the Media stack.
#
# community-scripts: ct/cloudflared.sh (stable / ProxmoxVE). NEW named tunnel
# `Homelab.Stacks.Media` — never touches the monolith CT 2001 or any existing
# tunnel (ADD-ONLY on Cloudflare, see CLAUDE.md). Single connector (HA not critical
# for media — if the node is down the media is down anyway).
#
# EXPOSURE SURFACE (trimmed 2026-06-23, user decision): only the two USER-FACING apps
# are public — seerr (request UI, CF Access OTP) + audiobookshelf (direct, mobile apps).
# The admin UIs (sonarr/radarr/prowlarr/bazarr/qbittorrent) + flaresolverr are INTERNAL
# only — reachable over the LAN/VLAN 1010, never through the tunnel. (Removing a hostname
# here stops the tunnel routing it AND the next converge prunes its managed DNS CNAME +
# CF Access app — declarative reconcile, #195. Only OUR records — the `managed by
# homelab-infra converge` CNAMEs pointing at THIS tunnel and the `<sub> (Media)` Access
# apps — are touched; hand-managed Cloudflare resources are never disturbed.)
# NOTE: the seerr/audiobookshelf hostnames currently resolve via DNS to the OLD-fleet
# namesakes (collision) — public URLs serve the old instances until the cutover (#10).
#
# Validate against ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: cloudflared
  stack: Media
  tags: [network, cloudflare, tunnel]

spec:
  app: cloudflared
  ctid: 5108
  cores: 1
  memory: 512            # MB
  disk: 2                # GB
  # node/os/network/storage/timezone inherited from the Media stack

  # Post-create wiring (converge / BL-010 — ADD-ONLY on Cloudflare):
  # 'dependsOn' names resolve as origin hostnames (e.g. http://seerr:5055).
  dependsOn: [seerr, audiobookshelf]
  config:
    tunnel: Homelab.Stacks.Media
    # CF Access gating (ADD-ONLY): converge ensures a self-hosted Access app +
    # allow-by-email policy on every NON-public ingress hostname below. With no other
    # IdP these emails log in via One-Time PIN (same pattern as PDM/Proxmox).
    access:
      allow: [csimon@chrison.dev]
      # Trusted home addresses — requests from here skip the OTP gate entirely (the app's
      # own login still applies). The `bypass-trusted-ip` policy sits alongside the allow and
      # is RECONCILED, not just created (#417): editing this list now actually moves live.
      # BOTH families are required — seerr is orange-clouded, so a dual-stack browser reaches
      # Cloudflare over IPv6 and a v4-only bypass never matches. See the Core tunnel shape for
      # the full write-up and the /56-not-/48 warning.
      bypass:
        - 118.67.199.127/32           # home WAN IPv4 (static)
        - 2407:8b00:116d:e500::/56    # home IPv6 prefix (DHCPv6-PD, sticky)
    # Ingress is a TUNNEL-level property defined ONCE here. ONLY the user-facing apps
    # are routed; the admin UIs + flaresolverr are internal-only (not listed = not exposed).
    # Entries flagged `public: true` get DNS + routing only (no CF Access — app's own auth).
    #
    # ⚠ Origins are PINNED TO THE NEW-STACK IPs, not logical hostnames (Path B cutover).
    # The old 5000-block fleet runs side-by-side and registers the SAME hostnames on
    # VLAN 1010 (old seerr 5011 @10.10.48.42, old abs 5014 @10.10.162.226) — DNS lets the
    # old CT win the `seerr`/`audiobookshelf` name, so `http://seerr:5055` resolved to OLD.
    # Pinning the new IPs forces the tunnel to the new CTs regardless of the collision.
    # DEPENDS ON DHCP reservations for these IPs (#13) — until reserved, a new lease on
    # 5105/5112 would silently break this. Retiring the old fleet later lets this revert
    # to logical names.
    ingress:
      - { hostname: seerr.chrison.dev,          service: "http://10.10.15.6:5055" }   # new seerr CT 5105 (was http://seerr:5055 → old 5011)
      # HOUSEHOLD front door (#322). Same origin as seerr.chrison.dev, different zone —
      # the family has no chrison.dev identity, which is the whole reason this hostname
      # exists. It used to ride the legacy `hpe-01` tunnel pointed at the OLD seerr CT 5011,
      # so stopping 5011 (#319) took the household offline without anyone noticing; moving it
      # here puts it on the same reconciled origin as everything else and lets #321 retire
      # that tunnel. public: true is REQUIRED — CF Access One-Time PIN only admits
      # csimon@chrison.dev, so gating this would lock the family out. Seerr's own Plex login
      # is the gate, which is exactly the identity the household already has (#316).
      - { hostname: seerr.tao-simon.family,     service: "http://10.10.15.6:5055", public: true }
      # audiobookshelf: PUBLIC/direct — native mobile apps can't do CF Access OTP, and it
      # carries its own account auth. public: true → routed, but NOT behind the Access gate.
      - { hostname: audiobookshelf.chrison.dev, service: "http://10.10.182.200:13378", public: true }   # new abs CT 5112 (was http://audiobookshelf:13378 → old 5014)
      # HOUSEHOLD audiobooks (#322), the pair to seerr.tao-simon.family above. This rode the
      # legacy hpe-01 tunnel pointed at the OLD abs CT 5014; retiring that tunnel (#321) took
      # both the ingress and the DNS record with it, so the hostname has been NXDOMAIN — the
      # family lost audiobooks entirely rather than being repointed to CT 5112. The
      # chrison.dev twin above was already on the new origin, which is why this went unnoticed.
      # public: true for the same reason as seerr's: CF Access admits only csimon@chrison.dev,
      # so gating it locks the household out, and the mobile apps can't answer an OTP anyway.
      # abs's own account login is the gate until #316 (Plex as IdP) gives the family a real one.
      - { hostname: audiobookshelf.tao-simon.family, service: "http://10.10.182.200:13378", public: true }
  secrets:
    - name: tunnelToken
      valueFrom:
        provider:
          name: cloudflare
          action: tunnel-token               # get-or-create tunnel by name + DNS CNAMEs (add-only); returns the token
          with: { tunnel: Homelab.Stacks.Media }
          auth: { env: CF_API_TOKEN }         # homelab-iac token from secrets.env
