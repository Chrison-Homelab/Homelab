# Windows 11 dev/build VM — GREENFIELD (created fresh, not adopted).
#
# Clones the proven Win11 recipe from the Gaming stack's windows.vm.yaml (VM 1002:
# q35 / OVMF / vTPM 2.0 / virtio-scsi) but with TWO deliberate differences:
#   1. GREENFIELD disks — fresh `size:` allocations (no `source:`), so the engine
#      creates the VM + its volumes from scratch.
#   2. NO hostpci — this is a headless build box, not a gaming VM; it keeps the
#      emulated display so the Proxmox console + RDP work.
#
# Purpose: test the Fallout .NET build framework across VS 2019/2022/2026 (IDE +
# Build Tools) MSBuild toolchains, installed fully unattended via the custom ISO
# built by scripts/build-iso.ps1 (autounattend.xml + virtio drivers) and the lean
# .NET-build VS install driven by unattend/provision-vs.ps1.
#
# Sizing: start-on-demand (onboot:false) at 12 GB on the 16 GB desktop-01 — the
# proven gaming-VM profile, leaves headroom for the host + idle LXCs. Raise later
# once desktop-01 sheds LXCs. The gaming VMs are also on-demand, so they and this
# box are effectively mutually exclusive on RAM (accepted).
#
# See ../../docs/plans/buildlab-windows-vm.md.

apiVersion: homelab/v1
kind: VM

metadata:
  name: buildvm
  stack: BuildLab
  tags: [buildlab, windows, dev]
  description: >-
    Windows 11 dev/build VM with Visual Studio 2019/2022/2026 (IDE + Build Tools).
    The Fallout build project test bed. Headless (RDP), throwaway OS reproduced
    via the unattended install pipeline.

spec:
  node: desktop-01
  vmid: 1100

  machine: q35
  bios: ovmf              # UEFI — pairs with the efidisk; required for a Win11 vTPM/Secure Boot guest
  cpu: host
  cores: 6
  sockets: 1
  memory: 12288           # MB — on-demand 12 GB; raise once desktop-01 sheds LXCs
  numa: false
  ostype: win11           # Windows 11 guest (drives sane QEMU defaults + TPM expectation)
  agent: true             # enable the QEMU guest agent (in-guest tools installed from virtio-win)
  onboot: false           # start on demand — borrows RAM only while testing

  scsihw: virtio-scsi-single
  disks:
    - id: scsi0
      storage: local-lvm
      size: 150           # GB — FRESH alloc (no source); thin on lvmthin, consumes only what's written.
                          # Sized for Win11 + 6 lean .NET-build VS installs + .NET SDKs + build artifacts.
      ssd: true
      iothread: true      # dedicated I/O thread (needs virtio-scsi-single)
      discard: true       # pass TRIM to the thin pool so deletes free space
  efidisk:
    storage: local-lvm    # FRESH EFI vars volume
    efitype: 4m           # 4m enables Secure Boot key storage
    preEnrolledKeys: true # ship Microsoft Secure Boot keys pre-enrolled
  tpmstate:
    storage: local-lvm    # FRESH vTPM state volume
    version: v2.0         # TPM 2.0 — required for Windows 11

  # First-boot install media — the custom unattended ISO (Win11 + virtio drivers +
  # autounattend.xml + the VS provisioner). Built + uploaded by scripts/build-iso.ps1 to
  # the `local` storage (content=iso) on desktop-01. Detach post-install: remove this
  # `cdrom` block and re-converge.
  cdrom:
    storage: local
    iso: buildlab-win11-unattended.iso

  network:
    bridge: vmbr0
    # net0 virtio, MAC auto-assigned. Add a UniFi DHCP reservation after first boot.

  boot:
    order: [scsi0, ide2, net0]   # disk first; falls through to the install ISO (ide2) on an empty disk
