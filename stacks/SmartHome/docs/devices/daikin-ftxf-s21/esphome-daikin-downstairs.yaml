# ESPHome — Downstairs Daikin FTXF50TVMA via S21 (XIAO ESP32-C6)
#
# Flash from the ESPHome LXC (CT 6003, #251). Lands as a native HA climate entity
# `climate.downstairs_ac` over the ESPHome API — no MQTT, no cloud.
#
# Wiring / BOM: ./hardware/README.md   ·   Component: github.com/joshbenner/esphome-daikin-s21
# S21 is 2400 baud 8E2 @ 5V logic → level shifter to the 3.3V C6. TX/RX are crossed.
#
# Secrets (put in the ESPHome LXC's secrets.yaml, NOT here):
#   wifi_ssid / wifi_password  ·  api_encryption_key  ·  ota_password

substitutions:
  name: downstairs-ac
  friendly_name: Downstairs AC

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1   # XIAO ESP32-C6; verify variant in your ESPHome version
  framework:
    type: esp-idf             # C6 needs the ESP-IDF framework (no Arduino target)

# --- The Daikin S21 component ------------------------------------------------
external_components:
  - source: github://joshbenner/esphome-daikin-s21@main
    components: [daikin_s21]

# S21 UART: 2400 baud, 8 data bits, EVEN parity, 2 stop bits (8E2).
# Pins are the XIAO C6's labelled TX (D6/GPIO16) and RX (D7/GPIO17) — via the
# level shifter. Keep these matched to hardware/README.md.
uart:
  - id: s21_uart
    tx_pin: GPIO16
    rx_pin: GPIO17
    baud_rate: 2400
    data_bits: 8
    parity: EVEN
    stop_bits: 2

daikin_s21:
  tx_uart: s21_uart
  rx_uart: s21_uart

climate:
  - name: None                # inherit friendly_name → climate.downstairs_ac
    platform: daikin_s21
    visual:
      min_temperature: 16
      max_temperature: 30
      temperature_step: 0.5

# Handy diagnostics the unit exposes over S21
sensor:
  - platform: daikin_s21
    inside_temperature:
      name: Inside Temperature
    outside_temperature:
      name: Outside Temperature
    coil_temperature:
      name: Coil Temperature
    fan_speed:
      name: Fan RPM

# --- Standard node plumbing --------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # IoT VLAN 1040; DHCP-reserve after first boot (record MAC/IP in devices.md)
  ap:
    ssid: "${friendly_name} Fallback"

logger:
  # Freeing the hardware UART for S21; log over USB/network only.
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

captive_portal:
