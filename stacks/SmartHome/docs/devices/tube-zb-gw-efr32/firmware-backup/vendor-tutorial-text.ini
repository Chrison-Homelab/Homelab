第一部分，查找多模网关IP地址，默认DHCP#(注意ip连接需要固定ip，推荐域名连接)

  1，查找网关ip软件文件夹，三种方法可以扫描到多模自动板的IP地址#(同一局域网下)

  2，路由器，交换机，软路由后台查看
    以各路由器举例:
      小米路由器，叫DHCP静态分配 浏览器输入192.168.31.1 高级设置 点击DHCP静态IP分配
      爱快软路由:网络设置-DHCP设置-DHCP静态分配-启用
      华硕路由器:高级设置-内部网络-DHCP服务器-手动指定功能
      openwrt软路由:接口-DHCP/DNS-静态地址分配
   
  3，esphome集成， 
     配置>>设备与服务>>esphome-tube_zb_gw_efr32>>1个设备>>查看ESP_IP_Address
  
  4，打开网关ip地址
     设备与服务-esphome-1个设备-访问设备-查看ESP_IP_Address
     [$]网页已经加密-账号:cangji-密码:cangji

第二部分，zigbee部分 ⚠️(注意zigbee2mqtt和zha功能只能二选一)⚠️

  一，Zigbee Home Automation #(自动发现)
      添加ZHA路径==设置-设备与服务-添加集成-搜索zha

      无线电类型:
      EZSP = Silicon Labs EmberZNet protocol: Elelabs, HUSBZB-1, Telegesis
      串口设置
      串口设备路径*: socket://localhost:port
      数据流控制：software
      端口速度: 115200
      
    1，ip地址连接举例:
       #假如，你的多模版网关IP地址为:192.168.1.2
       #例如:[$]不要复制粘贴
       #则你的串口地址为:[$]socket://192.168.1.2:6638[$]    

    2，域名连接:socket://tube-zb-gw-efr32-xxxxxx.local:6638 #域名不需要设置静态IP
       #xxxxxx为每台设备后六位的wifi地址的mac地址（非以太网mac地址）已禁用WiFi
       #推荐ip连接，docker无法使用域名连接

  二，zigbee2mqtt

    1，[$]serial #协调器设置
       网关设置  #(localhost=网关局域网地址)
       多模自动版TCP端口6638 
       #################################
       adapter: ember
       port: tcp://localhost:port
       #################################

   3，[$]mqtt
      mqtt设置  #(localhost=在HA安装的Mosquitto局域网地址)  
      #################################
      base_topic: zigbee2mqtt
      server: mqtt://localhost:1883
      user: 
      password: 
      client_id: zigbee2mqtt
      #################################

第三部分，蓝牙部分 #(两个插件相似，可以都开启，会增加网关工作量)

  1，蓝牙代理 bluetooth-proxies #(自动发现)
    自动发现，无需配置，连上esphome集成即是连上蓝牙代理 加密设备要填入密钥#(前端红色弹窗)
    在设备与服务里的都是蓝牙代理

  2，蓝牙网关插件 Passive BLE Monitor #(非自动，hacs安装，集成里配置)
    hacs插件商城-集成-Passive BLE Monitor 插件-下载安装重启homeassistnat
    设置esphome-设备与服务-esphome-允许设备拨打Home Assistant服务呼叫
    打开Esp Bluetooth 开关 绿灯常亮
    设置Esp Bluetooth开机自启 自动化

  4，小米蓝牙设备先加入米家，和手机配对并获取密钥，然后就可以删除

  5，小米加密密钥获取方法1: ##(hacs安装，集成里配置)
     hacs插件商城-集成-Xiaomi Gateway 3 插件-下载安装重启homeassistnat
     集成-添加集成-Xiaomi Gateway 3-添加小米云账号-登录
     在Xiaomi Gateway 3集成中点击-选项-选择设备-提交
     Token或者Bindkey就是密钥

  6，小米加密密钥获取方法2:
     软件在其他文件中 小米token.exe
     username 手机号 邮箱 米家id
     server 米家服务器所在地址 一般 cn