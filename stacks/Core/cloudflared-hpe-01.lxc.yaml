# Core tunnel — connector replica #1 (hpe-01). PRIMARY: owns the named tunnel +
# ingress + token. The nuc-01 replica is a second connector for the SAME tunnel
# (see cloudflared-nuc-01.lxc.yaml). Per ADR-0005.
#
# community-scripts: ct/cloudflared.sh (stable / ProxmoxVE). Deliberately SEPARATE
# from the monolithic cloudflared CT 2001 (left untouched) — migration off CT 2001
# is hostname-by-hostname, add-only, and retires CT 2001's ingress LAST (#118).
# Validate against ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: cloudflared-hpe-01
  stack: Core
  tags: [network, cloudflare, tunnel, ha-primary]

spec:
  app: cloudflared
  ctid: 2010
  node: hpe-01            # replica pinned here (overrides: Core has no default node)
  cores: 1
  memory: 512            # MB
  disk: 2                # GB
  # os/network/storage/timezone inherited from the Core stack

  # Post-create wiring (converge / BL-010 — ADD-ONLY on Cloudflare, see CLAUDE.md):
  config:
    tunnel: Homelab.Stacks.Core              # NEW named tunnel — never touches existing tunnels / CT 2001

    # CF Access trusted-IP bypass (#417). Every hostname below is gated by a HAND-MADE
    # Access app (`Pangolin (admin SSO)`, `PDM (…)`, `Proxmox node UI (break-glass)`) —
    # this block does NOT try to own those. There is deliberately NO `allow:` key: with
    # only `bypass:` set, converge creates no allow policy and leaves the hand-made ones
    # (and their differing names) untouched, while still reconciling the one policy we do
    # own, `bypass-trusted-ip`. The apps are found by domain, so nothing is created; the
    # prune only ever matches apps named `… (Core)`, which none of these are.
    #
    # ⚠ BOTH ADDRESS FAMILIES, or the bypass silently does nothing. The v4 entry alone
    # was the original bug: these hostnames are orange-clouded, so Cloudflare publishes
    # AAAA records, the house has native IPv6 from Quic, and browsers prefer it — so
    # Access saw an IPv6 client that the /32 could never match and served a One-Time PIN
    # on every visit. Worse than it sounds: every *.lab/*.arr resource bounces through
    # pangolin.chrison.dev/auth/resource/… for its SSO gate, so the PIN sat in the login
    # path of the whole admin surface. Verify a change with BOTH:
    #     curl -sI -4 https://pangolin.chrison.dev   # expect 200 from the origin
    #     curl -sI -6 https://pangolin.chrison.dev   # expect 200 — a 302 to
    #                                                # chrison.cloudflareaccess.com = still gated
    access:
      bypass:
        - ${HOME_WAN_IP}/32           # home WAN IPv4 — static (matches `publicIp` in pangolin.lxc.yaml)
        - ${HOME_WAN_IPV6_PREFIX}/56  # home IPv6 prefix — DHCPv6-PD from Quic, sticky in practice
                                      # (UniFi shows no reservation for it, confirmed stable by the
                                      # user). The /56 is the whole house: all four VLANs draw their
                                      # /64s from it (1000/1010/1020/1040, e.g. …e503::/64). Do NOT
                                      # widen this to the /48 — that is Quic's pool, i.e. other
                                      # customers, and would let them past the gate. If OTP ever
                                      # returns at home, re-check the prefix here first.

    # Ingress is a TUNNEL-level property defined ONCE here (the replica omits it).
    ingress:
      # Pangolin — SSO remote-access front door (ADR-0007). Replaces Teleport, whose
      # CT 9904 was decommissioned via `proxmoxsharp lxc delete` (#149); its dead
      # teleport.chrison.dev ingress entry was removed here. Now targets the NEW Docker
      # EE Pangolin CT 2013 (the re-platform, #168) — Traefik on :80, plain HTTP behind
      # this tunnel (CF provides the dashboard's public TLS; CF Access OTP gates it). The
      # *.lab/*.arr admin UIs are served by the SAME CT's Traefik on public :443 instead.
      # (Old native CT 2012 stays alive as rollback until retired.)
      - hostname: pangolin.chrison.dev
        service: "http://10.10.0.13:80"         # CT 2013 (Docker EE) static IP (Homelab VLAN)

      # ── Authentik — the homelab IdP (#469, CT 2014 / hpe-01) ──────────────────────
      # APEX, NOT A ZONE. Core services are fronted at `<name>.chrison.dev` rather than
      # buried under `*.lab` — pangolin, pdm and proxmox already are, and identity is the
      # same class of thing: a front door you reach directly, not an app behind one.
      #
      # ⚠ public: true IS LOAD-BEARING — WITHOUT IT THIS HOSTNAME BECOMES UNREACHABLE FROM
      #   OUTSIDE THE HOUSE. The Core shape sets `access.bypass` but deliberately no
      #   `access.allow` (the other three apps are hand-made). For a host that already has
      #   an Access app that means "reconcile only the bypass policy" — but for a NEW host
      #   it means converge CREATES an app and gives it a bypass-IP policy and nothing else.
      #   An Access app whose only policy is a bypass denies every request that does not
      #   match it, so remote logins would fail closed while converge reported success.
      #
      # Un-gated is also the right answer on the merits, not just the safe one. Authentik IS
      # the auth layer; putting CF Access in front of it repeats the mistake we already ruled
      # out for Pangolin SSO — gating the IdP behind something that can itself fail, so an
      # outage in the gate locks you out of the tool you need to fix the gate. Same reason
      # this is NOT a Pangolin resource. Authentik carries its own login, MFA and brute-force
      # policies and is built to face the internet; that is the gate.
      #
      # Origin by internal NAME, not IP (CLAUDE.md): 10.10.221.211 is a UniFi reservation and
      # the CT resolves identity.homelab.chrison.internal against the gateway at 10.10.0.1,
      # so a re-address stays a DHCP edit. :9000 is Authentik's plain HTTP listener — :9443 is
      # its self-signed TLS, which we deliberately do not publish.
      - hostname: identity.chrison.dev
        service: "http://identity.homelab.chrison.internal:9000"
        public: true
      # REMOVED 2026-08-02 (#321): traefik.chrison.dev pointed at 10.10.0.12, the OLD native
      # Pangolin CT 2012. That origin no longer exists, so the hostname served a public 502.
      # Superseded by traefik.lab.chrison.dev, which Pangolin serves on its own :443 (302 at
      # the SSO gate). Dropping the entry here also prunes the DNS record: the CNAME carries
      # our managed comment and points at this tunnel, so CnamesToPrune removes it once the
      # hostname leaves the shape (#195) — no hand-deletion on the shared zone.
      # ── Break-glass admin behind Cloudflare Access (ADR-0005, live 2026-06-14) ──
      # Two admin front doors, each a CF Access self-hosted app gated by One-Time PIN
      # (policy: allow csimon@chrison.dev). The per-node `pve-*` hostname idea is dropped.
      #
      # PDM (Proxmox Datacenter Manager — CT 2002 / nuc-01): the cluster fleet manager.
      # ⚠ origin IP is DHCP → pinned via a UniFi reservation (#117-class).
      - hostname: pdm.chrison.dev
        service: "https://10.10.208.155:8443"
        originRequest: { noTLSVerify: true }
      # proxmox.chrison.dev: a real Proxmox NODE UI (PDM is NOT a drop-in for it), so
      # this stays a node. Cut over from the monolith CT 2001 on 2026-06-14. Its Access
      # app has a SECOND, non-identity policy accepting a service token, so the public
      # /api2/json endpoint still works non-interactively (creds in secrets.env:
      # CF_ACCESS_PROXMOX_CLIENT_ID / _SECRET). Targets nuc-01; both Core replicas can
      # reach it.
      #
      # ⚠ 10.0.0.11 is nuc-01's VLAN 1000 address (#341). This shape still said
      # 192.168.179.1 — the pre-migration one — long after the nodes moved. Someone had
      # corrected it LIVE, and the first converge after that silently pushed the dead
      # address back, because the shape is the source of truth and the shape was stale.
      # Fixing live state without fixing the shape buys you exactly one converge.
      - hostname: proxmox.chrison.dev
        service: "https://10.0.0.11:8006"
        originRequest: { noTLSVerify: true }
  secrets:
    - name: tunnelToken
      valueFrom:
        provider:
          name: cloudflare
          action: tunnel-token               # get-or-create tunnel by name + DNS CNAME (add-only); returns the token
          with: { tunnel: Homelab.Stacks.Core }
          auth: { env: CF_API_TOKEN }         # scoped token from secrets.env
