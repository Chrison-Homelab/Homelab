# Homelab identity model — groups, and Pangolin as the first OIDC client (#468).
#
# ONE FILE ON PURPOSE. Authentik applies entries within a blueprint IN ORDER, but gives no
# ordering guarantee BETWEEN blueprint files. Splitting the groups into their own file and
# reaching for them here with `!Find` would be a race on first apply: if this file ran first
# the lookup would miss, and a PolicyBinding whose group resolves to nothing is not a binding
# that fails safe. Groups are therefore defined here and referenced by `!KeyOf`, which is an
# exact reference to an entry in this same file rather than a lookup that can come up empty.
#
# THE AUTHORISATION MODEL, in two independent layers:
#
#   1. HERE — may you get a token for Pangolin at all? Only members of the four groups below.
#      A user in NO group matches no binding and is denied. That matters because the Plex
#      source enrolls friends automatically (`allow_friends: true` +
#      `default-source-enrollment`), so "authenticated" must never imply "authorised".
#   2. PANGOLIN — which resources may you reach? Its own resource↔role matrix, which today
#      grants every resource to the Admin role ONLY. So a Family or Guests member can obtain
#      a token and reach nothing until a resource is deliberately opened to their role.
#
# Both layers deny by default, and neither relies on the other being correct.
#
# `groups` needs no custom property mapping — Authentik's stock `profile` scope already emits
# `[group.name for group in request.user.groups.all()]`, which is what Pangolin's roleMapping
# reads. Verified against the live scope mapping rather than assumed.

version: 1
metadata:
  name: homelab - identity model
  labels:
    blueprints.goauthentik.io/description: |
      Homelab access groups and the Pangolin OIDC client. Managed by converge from
      stacks/Core/authentik/assets/blueprints — edit there, not in the UI.

entries:
  # ── Groups ────────────────────────────────────────────────────────────────────────
  # ⚠ NAMES CONTAIN NO SPACES OR CAPITALS, AND THAT IS A HARD CONSTRAINT, NOT A STYLE.
  # A group name travels to relying parties inside the `groups` claim, and they parse that
  # list with their own rules. Pulse splits its allow-list on WHITESPACE AS WELL AS COMMAS:
  #
  #   strings.FieldsFunc(value, func(r rune) bool {
  #       return r == ',' || r == ' ' || r == '\t' || r == '\n' || r == '\r' })
  #
  # so `Homelab Admins` in OIDC_ALLOWED_GROUPS becomes `Homelab` + `Admins`, neither of which
  # matches anything, and the gate fails closed with no message saying why. These were
  # originally title-case with spaces and were renamed before anything but Pangolin and Pulse
  # depended on them. Keep new ones lowercase-hyphenated; an access-control identifier that
  # some consumer might re-split is a lockout waiting to happen.
  #
  # TWO AXES, deliberately. `Family`/`Guests` say WHO SOMEONE IS; the `<Stack> Admins`
  # groups say WHAT THEY ADMINISTER, one per stack, so access can be granted a stack at a
  # time instead of all-or-nothing.
  #
  # NO GROUP HIERARCHY, even though authentik has one. Its parentage resolves UPWARD — a
  # member of a child group inherits the parent's access — so making the stack groups
  # children of `Homelab Admins` would give whoever administers Media the Core stack too,
  # which is the exact opposite of the point. `Homelab Admins` is instead the superset by
  # being BOUND TO EVERY APPLICATION alongside that application's own stack group. Costs one
  # extra binding per app and cannot silently over-grant.
  #
  # ONLY STACKS THAT HAVE A LOGIN GET A GROUP. Azure, BuildLab, Gaming, Photos, ShopDemo,
  # ErpForFactoryGames and Komodo are dormant or have no authenticated surface; empty groups
  # are just noise in an access model whose whole value is being readable. Add one when the
  # stack gains something to log in to.
  #
  # NOT `is_superuser`. That flag is Authentik's OWN admin rights (the built-in "authentik
  # Admins" group has it) and is unrelated to what these groups are for, which is deciding
  # who reaches which homelab application. Granting it here would hand anyone in Family the
  # ability to rewrite the access model they are subject to.
  - model: authentik_core.group
    id: grp-homelab-admins
    identifiers: { name: homelab-admins }
    attrs:
      is_superuser: false
      attributes:
        homelab.chrison.dev/purpose: Superset — bound to every application alongside its own stack group

  - model: authentik_core.group
    id: grp-media-admins
    identifiers: { name: media-admins }
    attrs:
      is_superuser: false
      attributes:
        homelab.chrison.dev/stack: Media
        homelab.chrison.dev/purpose: The arr fleet — Sonarr, Radarr, Prowlarr, Bazarr, qBittorrent, Tracearr, Youtarr, Shelfmark

  - model: authentik_core.group
    id: grp-core-admins
    identifiers: { name: core-admins }
    attrs:
      is_superuser: false
      attributes:
        homelab.chrison.dev/stack: Core
        homelab.chrison.dev/purpose: Ingress and identity — Pangolin, authentik, Traefik, and the Proxmox/PDM break-glass surface

  - model: authentik_core.group
    id: grp-monitoring-admins
    identifiers: { name: monitoring-admins }
    attrs:
      is_superuser: false
      attributes:
        homelab.chrison.dev/stack: monitoring
        homelab.chrison.dev/purpose: Pulse, Grafana, Prometheus

  - model: authentik_core.group
    id: grp-smarthome-admins
    identifiers: { name: smarthome-admins }
    attrs:
      is_superuser: false
      attributes:
        homelab.chrison.dev/stack: SmartHome
        homelab.chrison.dev/purpose: Home Assistant and ESPHome — administration, as distinct from Family's day-to-day use

  - model: authentik_core.group
    id: grp-devops-admins
    identifiers: { name: devops-admins }
    attrs:
      is_superuser: false
      attributes:
        homelab.chrison.dev/stack: DevOps
        homelab.chrison.dev/purpose: Forgejo and the shell host

  - model: authentik_core.group
    id: grp-family
    identifiers: { name: family }
    attrs:
      is_superuser: false
      attributes:
        homelab.chrison.dev/purpose: Household apps — Seerr, Audiobookshelf, RomM, Home Assistant

  - model: authentik_core.group
    id: grp-guests
    identifiers: { name: guests }
    attrs:
      is_superuser: false
      attributes:
        homelab.chrison.dev/purpose: Deliberately narrow — media requests only

  # ── Pangolin: OAuth2/OIDC provider ────────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: pangolin-provider
    identifiers: { name: Pangolin }
    attrs:
      client_type: confidential
      # Both values are generated into Bitwarden Secrets Manager and reach this container as
      # podman secrets, so the pair is never typed into a UI and never copied out of one. The
      # SAME two values are handed to Pangolin's IdP registration — that is the whole point of
      # fixing them here rather than letting Authentik mint them.
      client_id: !Env AUTHENTIK_PANGOLIN_CLIENT_ID
      client_secret: !Env AUTHENTIK_PANGOLIN_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Pangolin reads the groups claim out of the ID TOKEN to pick a role, so the claims have
      # to be in there rather than only behind a userinfo call.
      include_claims_in_id_token: true
      # ⚠ MUST BE SET EXPLICITLY. On 2026.8 `grant_types` is an allow-list that defaults to
      # EMPTY, and an empty list permits nothing — so a provider created without it looks
      # perfectly configured and rejects every single authorization request with
      # `invalid_request` / "The request is otherwise malformed". The real reason only appears
      # in the server log as "Invalid grant_type for provider". Older releases had no such
      # field, which is why essentially every example blueprint online omits it.
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      # REGEX, not strict. Pangolin builds its callback as
      # `<dashboardUrl>/auth/idp/${idpId}/oidc/callback` and idpId is assigned by Pangolin when
      # the IdP row is created — so a strict URI would need the id before it exists, and would
      # silently stop matching if the IdP were ever recreated with a new id. Confirmed against
      # Pangolin's own bundle, which validates callbacks with `/auth/idp/[0-9]+/oidc/callback`.
      redirect_uris:
        - matching_mode: regex
          url: https://pangolin\.chrison\.dev/auth/idp/[0-9]+/oidc/callback

  # ── Pangolin: application ─────────────────────────────────────────────────────────
  - model: authentik_core.application
    id: pangolin-app
    identifiers: { slug: pangolin }
    attrs:
      name: Pangolin
      provider: !KeyOf pangolin-provider
      meta_launch_url: https://pangolin.chrison.dev
      meta_description: Public ingress and SSO gate for the *.lab / *.arr / *.iot surface.
      # `any` — the four bindings below are alternatives, not requirements. With `all` a user
      # would have to be in every group at once, which would lock everyone out including you.
      policy_engine_mode: any

  # ── Who may authenticate to Pangolin ──────────────────────────────────────────────
  # EVERY group, deliberately — Pangolin is not a per-stack application, it is the front
  # door in front of all of them. Someone in Family who cannot authenticate here reaches no
  # household app either. What each group can actually SEE is Pangolin's resource↔role
  # matrix, which is the layer that stays closed until opened one resource at a time.
  #
  # Listed one by one rather than expressed as "any group": authentik has no such binding,
  # and an expression policy that approximated one would be a piece of code in the deny path.
  # Eight explicit lines are duller and cannot go subtly wrong.
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf pangolin-app, group: !KeyOf grp-homelab-admins }
    attrs: { order: 0, enabled: true }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf pangolin-app, group: !KeyOf grp-core-admins }
    attrs: { order: 1, enabled: true }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf pangolin-app, group: !KeyOf grp-media-admins }
    attrs: { order: 2, enabled: true }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf pangolin-app, group: !KeyOf grp-monitoring-admins }
    attrs: { order: 3, enabled: true }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf pangolin-app, group: !KeyOf grp-smarthome-admins }
    attrs: { order: 4, enabled: true }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf pangolin-app, group: !KeyOf grp-devops-admins }
    attrs: { order: 5, enabled: true }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf pangolin-app, group: !KeyOf grp-family }
    attrs: { order: 6, enabled: true }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf pangolin-app, group: !KeyOf grp-guests }
    attrs: { order: 7, enabled: true }

  # ── Pulse: OAuth2/OIDC provider ───────────────────────────────────────────────────
  # First Tier-1 migration off a local login (#485). Pulse is configured entirely from
  # OIDC_* environment variables, which authentik never sees — the only contract between the
  # two is this provider plus the client id/secret pair in Secrets Manager.
  - model: authentik_providers_oauth2.oauth2provider
    id: pulse-provider
    identifiers: { name: Pulse }
    attrs:
      client_type: confidential
      client_id: !Env AUTHENTIK_PULSE_CLIENT_ID
      client_secret: !Env AUTHENTIK_PULSE_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      include_claims_in_id_token: true
      # See the Pangolin provider: an empty grant_types allow-list permits NOTHING and fails
      # with a message that names no cause. It is not optional on 2026.8.
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      # STRICT, unlike Pangolin's. Pulse's env-configured provider uses one fixed callback
      # (`/api/oidc/callback`) rather than a generated per-provider id, so there is nothing to
      # wildcard and a strict match is the tighter choice.
      redirect_uris:
        - matching_mode: strict
          url: https://pulse.lab.chrison.dev/api/oidc/callback

  - model: authentik_core.application
    id: pulse-app
    identifiers: { slug: pulse }
    attrs:
      name: Pulse
      provider: !KeyOf pulse-provider
      meta_launch_url: https://pulse.lab.chrison.dev
      meta_description: Proxmox / Docker monitoring.
      policy_engine_mode: any

  # Its own stack group, plus the superset. This is the shape every Tier-1 app should take.
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf pulse-app, group: !KeyOf grp-homelab-admins }
    attrs: { order: 0, enabled: true }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf pulse-app, group: !KeyOf grp-monitoring-admins }
    attrs: { order: 1, enabled: true }

  # ── Krautwatch: OIDC provider ─────────────────────────────────────────────────────
  # Krautwatch (CT 5114, the Media podman host) can hand its web UI's sign-in to an IdP as of
  # v0.7.0. Registered here for the same reason Pangolin is: the client pair is fixed in
  # Bitwarden Secrets Manager rather than minted by Authentik and copied out of a UI.
  - model: authentik_providers_oauth2.oauth2provider
    id: krautwatch-provider
    identifiers: { name: Krautwatch }
    attrs:
      client_type: confidential
      client_id: !Env AUTHENTIK_KRAUTWATCH_CLIENT_ID
      client_secret: !Env AUTHENTIK_KRAUTWATCH_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Krautwatch checks the groups claim itself as a second layer, and reads it from the ID
      # token rather than depending on a userinfo round trip.
      include_claims_in_id_token: true
      # Same trap as Pangolin: an empty grant_types allow-list rejects every authorization
      # request with a message that says nothing about grant types.
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      # Strict, not regex: ASP.NET Core's handler uses one fixed callback path, so there is
      # nothing variable to match. Two URIs because the UI is LAN-only today (no hostname, no
      # CF Access app) and would move to a name the day it is fronted — registering both now
      # means that change is a compose edit rather than an identity change.
      redirect_uris:
        - matching_mode: strict
          url: http://10.10.255.254:5099/signin-oidc
        - matching_mode: strict
          url: https://krautwatch.chrison.dev/signin-oidc

  # ── Krautwatch: application ───────────────────────────────────────────────────────
  - model: authentik_core.application
    id: krautwatch-app
    identifiers: { slug: krautwatch }
    attrs:
      name: Krautwatch
      provider: !KeyOf krautwatch-provider
      meta_launch_url: http://10.10.255.254:5099
      meta_description: German public-TV indexer and download client for the *arr fleet.

  # ── Who may sign in ───────────────────────────────────────────────────────────────
  # Admins only. Krautwatch drives the download client and rewrites the media library's
  # contents; family and guests have Plex for the output and no business with the machinery.
  #
  # Krautwatch re-checks the groups claim itself, so a binding removed here does not silently
  # open the UI. That second check is configured with the group NAMES, not these entry ids:
  #
  #     Auth__Oidc__RequiredGroups=homelab-admins,media-admins
  #
  # which is why the names have to be kept in step with #497's rename. Krautwatch splits that
  # setting on commas only — never on whitespace — so a name containing a space would work
  # there, but the convention holds anyway: consumers that split on whitespace exist (Pulse
  # does), and a group name is a value every one of them re-parses with its own rules.
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf krautwatch-app, group: !KeyOf grp-homelab-admins }
    attrs: { order: 0, enabled: true }
  - model: authentik_policies.policybinding
    identifiers: { target: !KeyOf krautwatch-app, group: !KeyOf grp-media-admins }
    attrs: { order: 1, enabled: true }

  # ── Who is actually in a group ────────────────────────────────────────────────────
  # Without this the whole model is inert: the four bindings above admit only members of
  # those groups, and akadmin was in `authentik Admins` — which is Authentik's OWN admin
  # group and deliberately not one of them. So the sole human account could authenticate and
  # then be refused the Pangolin application. A converge reported success either way.
  #
  # ⚠ BOTH GROUPS LISTED ON PURPOSE. `groups` REPLACES the membership list rather than adding
  # to it, so naming only Homelab Admins here would strip akadmin of `authentik Admins` and
  # take away the ability to administer the IdP — a lockout caused by the change meant to
  # grant access.
  - model: authentik_core.user
    identifiers: { username: akadmin }
    attrs:
      groups:
        - !Find [authentik_core.group, [name, authentik Admins]]
        - !KeyOf grp-homelab-admins

  # ── Retire the previous title-case groups ─────────────────────────────────────────
  # A blueprint keys objects by `identifiers`, so changing `name` does NOT rename a group —
  # it creates a second one and orphans the first, complete with its members. The akadmin
  # entry above re-declares its full group list, so membership moves to the new names; these
  # entries clear away what would otherwise be eight abandoned groups that still look real in
  # the UI and would quietly grant nothing.
  #
  # Ordered last on purpose: the deletions must not run before the bindings that reference
  # the replacements exist.
  #
  # Safe to delete outright once applied everywhere — kept here as the record of the rename,
  # since a future reader will otherwise wonder why `Homelab Admins` is absent from a system
  # whose git history clearly created it.
  - model: authentik_core.group
    identifiers: { name: Homelab Admins }
    state: absent
  - model: authentik_core.group
    identifiers: { name: Media Admins }
    state: absent
  - model: authentik_core.group
    identifiers: { name: Core Admins }
    state: absent
  - model: authentik_core.group
    identifiers: { name: Monitoring Admins }
    state: absent
  - model: authentik_core.group
    identifiers: { name: SmartHome Admins }
    state: absent
  - model: authentik_core.group
    identifiers: { name: DevOps Admins }
    state: absent
  - model: authentik_core.group
    identifiers: { name: Family }
    state: absent
  - model: authentik_core.group
    identifiers: { name: Guests }
    state: absent
