# Pangolin — the homelab's SSO remote-access front door (ADR-0007).
#
# Replaces Teleport (CT 9904, never went live) as the authenticated door for admin
# UIs. Runs ON-PREM, behind the existing HA `core` Cloudflare tunnel — NO VPS. It is
# a self-hosted identity-aware reverse proxy (Traefik + an IdP/RBAC layer); a public
# VPS would only be needed to make Pangolin its OWN public ingress (its Gerbil/Newt
# WireGuard path), which is a separate, optional, #137-driven track — see ADR-0007.
#
# community-scripts: ct/pangolin.sh (stable / ProxmoxVE), pinned upstream to 1.18.4
# (Pangolin's schema changes break unattended updates). NATIVE systemd install
# (Node 24 + pangolin/gerbil/traefik binaries, SQLite OSS), NOT Docker. The script
# sets var_tun=1 (TUN for Gerbil's WireGuard) — Gerbil is installed but UNUSED in the
# behind-cloudflared model (no Newt clients). Validate against
# ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: pangolin
  stack: Core
  tags: [network, proxy, sso, remote-access]

spec:
  app: pangolin
  ctid: 2012
  node: nuc-01           # single instance (not HA — replica of an IdP buys little);
                         # lands on nuc-01, Teleport's old home, which it supersedes.
  cores: 2               # community-scripts ct/pangolin.sh defaults (Node build + Traefik)
  memory: 4096           # MB
  disk: 10               # GB
  # source(stable/main)/os(debian 13)/unprivileged/storage/timezone/onboot inherited
  # from the Core stack. var_tun is set by the script itself.
  #
  # STATIC IP (overrides the stack's dhcp default): the `core` tunnel targets this CT's
  # Traefik by IP, so pin it deterministically rather than relying on a DHCP reservation.
  # .12 ↔ ctid 2012, on the Homelab VLAN.
  network:
    bridge: vmbr0
    vlan: 1010
    ipv4: 10.10.0.12/16
    gateway: 10.10.0.1
    ipv6: none

  # ── Post-create wiring applied by the `pangolin` converge provisioner (#145).
  config:
    dashboardUrl: https://pangolin.chrison.dev
    baseDomain: chrison.dev
    # EDGE MODE — the load-bearing delta from the stock install. community-scripts
    # configures Traefik to OWN public ingress via Let's Encrypt (httpChallenge on
    # :80/:443). Behind cloudflared there is no public :80 for ACME, so the provisioner
    # must reconfigure Traefik to serve plain HTTP on :80 to the `core` tunnel and DROP
    # the LE certResolver + https-redirect. cloudflared provides the public TLS.
    edge: cloudflared        # vs 'letsencrypt' (the stock public-ingress default)
    flags:
      allowRawResources: true        # enables raw TCP/UDP resources (e.g. SSH)
      disableSignupWithoutInvite: true
      disableUserCreateOrg: false
      enableIntegrationApi: true     # integration API on :3003 — lets us manage resources
                                     # declaratively via the API (Bearer key) instead of by hand

    org: chrison             # Pangolin org id — resources are created under it

    # Declarative admin-UI resources (#136): the provisioner creates these via the
    # integration API (add-only, idempotent by fullDomain) using PANGOLIN_API_KEY from
    # secrets.env. ssl is forced OFF (behind-cloudflared, Pangolin SSO gates them via
    # badger). Each <subdomain>.chrison.dev ALSO needs its cloudflared ingress entry in
    # cloudflared-hpe-01.lxc.yaml (#165 pushes that idempotently). Migrate UIs by adding
    # entries here + the matching ingress, then `converge --apply`.
    resources:
      - name: Traefik Dashboard
        subdomain: traefik
        target: { ip: localhost, port: 8080, method: http }
  # No `secrets:` block: the provisioner GENERATES config.yml server.secret on the CT
  # the first time and PRESERVES it on every re-converge — no manual secrets.env step
  # (and no fail-fast on a missing declared secret). See PangolinProvisioner (#145).
