# Pangolin — the homelab's SSO remote-access front door (ADR-0007, Accepted #214).
#
# Replaces Teleport (CT 9904, never went live) as the authenticated door for admin
# UIs. Runs ON-PREM as Docker ENTERPRISE EDITION and is the PUBLIC INGRESS for two
# wildcard zones — *.lab.chrison.dev (general lab admin UIs) and *.arr.chrison.dev
# (arr stack admin UIs) — via a home-IP :443 port-forward to its Traefik, which
# terminates Let's Encrypt WILDCARD certs (DNS-01 via Cloudflare). EE (OIDC/RBAC) only
# ships on the fosrl/pangolin:ee Docker image; the native community-scripts install is
# OSS-only and can't activate a license (#168) — so this is a Docker host.
#
# RE-PLATFORM (this shape): a NEW CT 2013 stood up side-by-side with the legacy native
# CT 2012 (add-only, reversible). 2012 keeps serving the old behind-cloudflared model
# until cutover; retire it LAST (proxmoxsharp lxc delete 2012) once nothing rides it.
#
# app: debian → ct/debian.sh creates a plain base CT (var_nesting + var_keyctl make it
# Docker-capable); the `pangolin` provisioner then INSTALLS Docker non-interactively and
# RENDERS the compose (pangolin + traefik [+ optional gerbil]) + config + Traefik
# config and runs `docker compose up -d` (no manual layer-on). We deliberately avoid
# ct/docker.sh — its interactive Portainer/socket prompts hang over non-interactive SSH.
# The dashboard
# (pangolin.chrison.dev) still arrives via the core CF tunnel on plain :80; the
# *.lab/*.arr resources are served on public :443. EE license activation is a one-time
# manual /admin/license step (UI-only). Validate against
# ../../Infrastructure/schema/shape.schema.json.

apiVersion: homelab/v1
kind: LXC

metadata:
  name: pangolin
  stack: Core
  tags: [network, proxy, sso, remote-access, docker]

spec:
  app: debian            # plain base CT (ct/debian.sh) — Docker-capable via nesting+keyctl below
  provisioner: pangolin  # post-create dispatched to PangolinProvisioner (installs Docker + EE)
  ctid: 2013             # NEW CT, side-by-side with the legacy native CT 2012 (retired last)
  node: nuc-01           # single instance (not HA — replica of an IdP buys little);
                         # lands on nuc-01, Teleport's old home, which it supersedes.
  cores: 2
  memory: 4096           # MB — Docker daemon + pangolin/traefik
  disk: 15               # GB — Docker image layers + SQLite + LE certs + config

  features:
    nesting: true        # required: Docker-in-LXC (mirrors stacks/Media/youtarr.lxc.yaml)
    keyctl: true         # Docker/containerd keyring ops on unprivileged LXC

  # source(stable/main)/os(debian 13)/unprivileged/storage/timezone/onboot inherited
  # from the Core stack.
  #
  # STATIC IP (overrides the stack's dhcp default): the core tunnel targets the dashboard
  # by IP and the WAN :443 port-forward targets this CT, so pin it. .13 ↔ ctid 2013.
  network:
    bridge: vmbr0
    vlan: 1010
    ipv4: 10.10.0.13/16
    gateway: 10.10.0.1
    ipv6: none
  # Static IPs don't get a resolver from DHCP, and VLAN 1010 firewalls outbound public DNS
  # (8.8.8.8 is unreachable) — so point the CT at the gateway's resolver, which works. Without
  # this, in-CT apt/curl + the docker install fail to resolve (network unreachable).
  nameserver: 10.10.0.1

  # ── Post-create wiring applied by the `pangolin` converge provisioner.
  config:
    dashboardUrl: https://pangolin.chrison.dev   # dashboard stays on the core CF tunnel (plain :80)
    baseDomain: chrison.dev
    org: chrison-dev                             # Pangolin org id (the slug, not the display name) — resources created under it

    # EDGE MODE — public-wildcard (ADR-0007 end state): Traefik OWNS public :443 and mints
    # LE wildcard certs via the DNS-01 challenge (Cloudflare) for the zones below. (The
    # legacy 'cloudflared' mode — plain HTTP behind the core tunnel — is still supported by
    # the provisioner for rollback.)
    edge: public-wildcard
    wildcardZones: [lab, arr, iot]               # → *.lab + *.arr + *.iot .chrison.dev LE SANs
                                                 # `iot` added for the smart-home surface (#250). Converge
                                                 # declares the grey-cloud A record; verified no pre-existing
                                                 # `iot` record in the shared chrison.dev zone before adding.

    # ADDITIONAL BASE DOMAINS (#322) — Pangolin can now front more than one registrable
    # domain. `baseDomain` above always stays `domain1` (Pangolin keys resources by
    # domainId, so reordering would re-point every existing resource); each entry here
    # becomes domain2, domain3… Unlike the zoned base domain, an additional domain is
    # fronted at its OWN APEX — the cert covers `<domain>` + `*.<domain>`, with no zone
    # segment — and a resource selects it with `domain: <domain>` instead of `zone:`.
    #
    # DELIBERATELY EMPTY. The capability exists; nothing needs it yet. Before enabling one:
    #   1. The zone MUST be on CF_API_TOKEN's DNS:Edit list — Traefik solves LE DNS-01 via
    #      Cloudflare with that same token (it is the same value as /opt/pangolin/.env's
    #      CF_DNS_API_TOKEN), so issuance fails for that domain alone if it is missing.
    #   2. Converge will declare a grey-cloud A record for `*.<domain>` → publicIp. That
    #      wildcard catches EVERY unmatched subdomain in the zone and sends it to the home
    #      edge — check nothing pre-existing depends on NXDOMAIN there first (CLAUDE.md:
    #      the family zone also carries iCloud Mail records that are NOT ours).
    # tao-simon.family was the motivating case, but its one live hostname
    # (seerr.tao-simon.family) rides the Media cloudflared tunnel instead — cheaper, and no
    # wildcard A record. Enable this only if that zone gains a zoned admin surface.
    # additionalDomains: [tao-simon.family]
    # Home WAN IP the public :443 port-forward lives behind (#221, ADR-0007). The provisioner
    # declares a grey-cloud (proxied:false) A record per wildcard zone → this IP, so every
    # *.<zone> hostname Traefik mints a cert for actually resolves to the home edge. Add-only +
    # ManagedComment-stamped (so #195's prune leaves hand-managed records alone). Update if the
    # WAN IP changes. The UniFi :443 port-forward itself is still hand-managed (gated on #102).
    publicIp: 118.67.199.127

    # GERBIL ENDPOINT — where Newt connectors are told to send WireGuard. Deliberately the
    # INTERNAL address, not publicIp.
    #
    # publicIp is the correct default for a remote site, and it is what the code falls back to
    # (#444, which fixed this pointing at the Cloudflare-proxied dashboard — WireGuard UDP does
    # not survive Cloudflare's proxy). But every site we have is on this LAN, and the gateway
    # does NOT hairpin: from CT 3005, `curl https://118.67.199.127` fails outright while
    # `https://10.10.0.13` answers. So a LAN connector handed the public IP cannot reach the
    # edge sitting one subnet away — the websocket control plane connects over :443 through
    # Cloudflare, then WireGuard times out and Newt logs "all 5 ping attempts failed".
    #
    # The alternative was enabling NAT loopback on the UniFi gateway. Rejected: it makes every
    # LAN connector's data path leave and re-enter the network to reach a host it can already
    # see, to work around an addressing choice rather than a requirement.
    #
    # ⚠ CONSEQUENCE: while this is set, a genuinely REMOTE site cannot connect — it would be
    #   handed a private IP. That is fine today (all sites are on-LAN) and it resolves itself at
    #   the VPS graduation (ADR-0007 decision #4 / #137): Gerbil moves off-site, this becomes the
    #   VPS's public address, and the home connectors dial outward with no hairpin involved.
    gerbilEndpoint: 10.10.0.13
    letsEncryptEmail: csimon@chrison.dev
    leStaging: false                             # flip true to use the LE STAGING CA while iterating
    # GERBIL — WireGuard server, ON (#406). This is the upstream-recommended topology:
    # pangolin + traefik + gerbil, rather than the trimmed pangolin + traefik we ran during
    # the home-IP trial. Turning it on now buys three things, in increasing order of value:
    #
    #   1. It unblocks RAW TCP/UDP resources, which is how the shell host (#404) gets an
    #      off-network SSH path — the decision recorded on #406.
    #   2. It is the prerequisite for NEWT clients, i.e. a site dialling OUT to Pangolin.
    #      That is the same shape as a Cloudflare tunnel, on our own edge.
    #   3. It is the graduation path ADR-0007 already documents (#137): once a VPS runs the
    #      public ingress, the home network goes back to outbound-only. Running Gerbil here
    #      first means that move is a relocation, not a re-architecture.
    #
    # ⚠ TOPOLOGY CHANGE, not a flag flip. With gerbil on, GERBIL owns :80/:443 (tcp+udp) and
    #   traefik joins its network namespace (network_mode: service:gerbil) instead of
    #   publishing the ports itself. Applying this RESTARTS the public front door for
    #   *.lab / *.arr / *.iot — Home Assistant, every arr UI, Pulse. Do it deliberately.
    #   Needs the 51820/udp + 21820/udp forwards declared in
    #   ../../Infrastructure/unifi/network.yaml to be in place for WireGuard to be reachable.
    includeGerbil: true

    # Image/version pins (the pieces confirmed live during rollout). Defaults live in
    # PangolinProvisioner; override here if a bump is needed:
    # image: fosrl/pangolin:ee-1.21.1
    # gerbilImage: fosrl/gerbil:1.5.0
    # traefikImage: traefik:v3.6
    # badgerVersion: v1.2.0
    #
    # ⚠ pangolin + gerbil + NEWT are ONE decision, not three. Upstream ships no compatibility
    # matrix — its installer just takes the newest tag of each at build time — and a mismatch
    # is silent in both directions:
    #   * gerbil BEHIND pangolin — an already-registered WireGuard peer survives the bump, so
    #     the stack looks healthy and each site connector dies on its next reconnect instead,
    #     possibly days later with no obvious link to the update (#455).
    #   * newt AHEAD of pangolin — newt speaks a protocol the server has not shipped yet.
    #     pangolin 1.21.0's same-network detection "requires updated clients and sites", and
    #     newt 1.15.0 added the connector half; newt 1.16.0 against ee-1.19.4 could not build
    #     its clients interface at all (#457).
    # Newt is pinned in ../DevOps/newt.lxc.yaml, NOT here — check it when bumping these.

    flags:
      allowRawResources: true        # enables raw TCP/UDP resources (e.g. SSH)
      disableSignupWithoutInvite: true
      disableUserCreateOrg: false
      enableIntegrationApi: true     # integration API on :3003 — declarative resource mgmt

    # ── Identity providers (#468) ─────────────────────────────────────────────────
    # Authentik (CT 2014) is the homelab IdP; Pangolin is a downstream client of it, not a
    # peer. Reconciled through the same integration API as `resources` below, and reconciled
    # rather than add-only for the #309 reason: an authUrl left pointing at a stale issuer is
    # a login loop that a clean-looking plan actively hides.
    #
    # CREDENTIALS BY REFERENCE, NOT BY VALUE. clientIdFrom/clientSecretFrom name keys in
    # secrets.env; the SAME two keys are consumed by Authentik's blueprint via `!Env`, so both
    # ends of the OIDC relationship are configured from one source and neither is copied out
    # of a UI. The client secret cannot be read back from Pangolin, so it is not drift-checked
    # — rotate by changing it in Secrets Manager and deleting the IdP so this recreates it.
    #
    # ROLE MAPPING is a JMESPath expression Pangolin evaluates against the ID token claims,
    # whose result is normalised to Pangolin role names. `groups` comes from Authentik's stock
    # `profile` scope with no custom mapping needed. In JMESPath `a && b` yields b when a is
    # truthy and `x || y` yields y when x is falsy, so this reads: Homelab Admins become
    # Pangolin Admins, everyone else becomes a Member.
    #
    # ⚠ MEMBER IS NOT A DOWNGRADE TO "LESS ACCESS" — TODAY IT IS NO ACCESS AT ALL. Every
    #   resource in this file currently grants the Admin role only, so a Member authenticates
    #   successfully and then sees nothing. That is deliberate for now (deny by default while
    #   the group model is built out), but it means adding someone to Family and expecting
    #   them to reach Seerr will NOT work until the resource↔role matrix exists.
    idps:
      - name: Authentik
        authUrl: https://identity.chrison.dev/application/o/authorize/
        tokenUrl: https://identity.chrison.dev/application/o/token/
        clientIdFrom: AUTHENTIK_PANGOLIN_CLIENT_ID
        clientSecretFrom: AUTHENTIK_PANGOLIN_CLIENT_SECRET
        identifierPath: sub
        emailPath: email
        namePath: preferred_username
        scopes: openid profile email
        # Pangolin creates a local user on first successful login. Safe here because Authentik
        # has already decided the person belongs to one of the four groups — without that
        # binding, autoProvision would mean every Plex friend gets a Pangolin account.
        autoProvision: true
        roleMapping: "contains(groups, 'Homelab Admins') && 'Admin' || 'Member'"

    # Declarative resources (#136): the provisioner upserts these via the integration API
    # using PANGOLIN_API_KEY, RECONCILING each one (#309): found by fullDomain, then the target
    # (ip/port/method/enabled) and the ssl/sso gates are compared against live and corrected, so
    # editing an entry here actually moves the live route. A resource with MORE THAN ONE target is
    # left alone — we only ever declare one, and rewriting the first of several would destroy
    # hand-built load balancing. A `zone` (lab|arr) makes
    # fullDomain = <subdomain>.<zone>.chrison.dev, served on :443 with the wildcard cert and
    # gated by Pangolin auth (badger). In public-wildcard mode ssl is ON (Traefik terminates).
    # sso defaults ON (the auth gate); set `sso: false` only for native clients that can't do
    # the SSO interstitial (e.g. Plex, audiobookshelf). A new service is just an entry here +
    # a grey-cloud A record (handled by converge) — no per-host cert, no per-host cloudflared ingress.
    resources:
      # Pangolin's own Traefik dashboard — first migrated UI (kept from #136).
      - name: Traefik Dashboard
        subdomain: traefik
        zone: lab
        target: { ip: localhost, port: 8080, method: http }
      # PowerOrchestrator dashboard/control API (#191) — systemd service on nuc-01's legacy
      # IP; CT 2013 reaches it cross-VLAN via the 10.10.0.1 gateway. sso is REQUIRED here: the
      # control API (Wake/Sleep/Arm) has no native auth (#238).
      - name: Power Orchestrator
        subdomain: power
        zone: lab
        sso: true
        target: { ip: 192.168.179.1, port: 8080, method: http }
      # Home Assistant (SmartHome stack) — replaces the raw :8123 UniFi port-forward with
      # SSO-gated ingress. sso REQUIRED (it controls the whole smart home).
      #
      # ⚠ HA-SIDE PREREQUISITE, and it is not just the YAML. HA must have
      # `use_x_forwarded_for: true` + 10.10.0.13 in `trusted_proxies`, or it answers every
      # proxied request with a bare "400: Bad Request". Setting that in configuration.yaml is
      # NOT sufficient on current HA: it snapshots the http config into `.storage/http`
      # ("Using stable HTTP config" at boot, `yaml_migration_done: true`) and serves from the
      # snapshot, so a later YAML edit is parsed, validated and then ignored. Change it where
      # HA now owns it, not only in the file.
      #
      # Targeted BY NAME (#339) — resolvable from CT 2013 (verified). Same pattern as Pulse
      # below.
      # Home Assistant on CT 6005 — the container replacement (#250), and now the ONLY
      # external HA surface. The cutover this block always described is done: the `lab`-zone
      # twin was removed here, because both names resolve to CT 6005 (10.10.0.21) since the
      # HAOS VM was retired, so the second resource was a duplicate front door rather than a
      # rollback path.
      #
      # ⚠ Removing it here only stops converge RE-CREATING it — the reconciler is add-only
      # (it counts created/retargeted/re-gated, it never prunes), so the existing Pangolin
      # resource must also be deleted once by hand. Deleting it in the UI while it was still
      # declared here is why it kept coming back.
      - name: Home Assistant (CT 6005)
        subdomain: homeassistant
        zone: iot
        sso: true
        target: { ip: homeassistant.iot.chrison.internal, port: 8123, method: http }
      # Pulse — fleet monitoring UI (stacks/monitoring CT 4000). SSO-gated; served at
      # pulse.lab.chrison.dev (covered by the *.lab wildcard — no new DNS record).
      - name: Pulse
        subdomain: pulse
        zone: lab
        sso: true
        target: { ip: monitoring.homelab.chrison.internal, port: 7655, method: http }   # Pulse on CT 4001; a NAME, not an address (#303) — verified resolvable from CT 2013
      # ── arr admin UIs (Phase 5 cutover). Origins PINNED to the new 5100-block CT IPs on
      #    VLAN 1010 (validated live per-port 2026-07-14). DEPENDS ON DHCP reservations for
      #    these IPs (#13) — until reserved, a new lease silently breaks the target (same
      #    caveat as stacks/Media/cloudflared.lxc.yaml). Retiring the old fleet later lets
      #    these revert to logical names.
      #
      #    sso defaults ON (badger SSO gate). Two exceptions, both for the same reason: a
      #    NATIVE CLIENT cannot complete the SSO interstitial — it is an HTML login page, and
      #    the app expects the app's own API to answer. Both carry real auth of their own, so
      #    sso:false gates them one layer down rather than not at all:
      #      • audiobookshelf — its own accounts, plus the iOS/Android apps.
      #      • seerr          — Plex OAuth, plus the native iOS clients (PocketSeerr).
      #    ⚠ Anything listed sso:false is reachable from the public internet with only the
      #      APP's login in front of it. Only do this where the app genuinely has one.
      - { name: Prowlarr,       subdomain: prowlarr,       zone: arr, target: { ip: 10.10.201.184, port: 9696,  method: http } }
      - { name: Sonarr,         subdomain: sonarr,         zone: arr, target: { ip: 10.10.250.29,  port: 8989,  method: http } }
      - { name: Radarr,         subdomain: radarr,         zone: arr, target: { ip: 10.10.48.217,  port: 7878,  method: http } }
      - { name: Bazarr,         subdomain: bazarr,         zone: arr, target: { ip: 10.10.102.133, port: 6767,  method: http } }
      - { name: qBittorrent,    subdomain: qbittorrent,    zone: arr, target: { ip: 10.10.110.115, port: 8090,  method: http } }
      - { name: Seerr,          subdomain: seerr,          zone: arr, sso: false, target: { ip: 10.10.15.6,    port: 5055,  method: http } }
      - { name: Tracearr,       subdomain: tracearr,       zone: arr, target: { ip: 10.10.202.145, port: 3000,  method: http } }
      - { name: RomM,           subdomain: romm,           zone: arr, target: { ip: 10.10.202.240, port: 80,    method: http } }
      - { name: Youtarr,        subdomain: youtarr,        zone: arr, target: { ip: 10.10.73.250,  port: 3087,  method: http } }
      - { name: Audiobookshelf, subdomain: audiobookshelf, zone: arr, sso: false, target: { ip: 10.10.182.200, port: 13378, method: http } }
      - { name: Shelfmark,      subdomain: shelfmark,      zone: arr, target: { ip: 10.10.142.183, port: 8084,  method: http } }

      # ── Shell host browser terminal (#479) — REPLACES the `mode: ssh` resource from #440.
      #
      #    This is now an ordinary HTTP resource pointing at Zellij's own web client, served by
      #    CT 3003 on :8082. The reason for the swap is not the UI: Pangolin's SSH resource asks
      #    for the HOST's credentials after the SSO gate, so it required an OS password on the
      #    account. Zellij's does not, so SHELL_USER_PASSWORD is retired and that box is
      #    key-only again. Losing an unlocked account on an internet-reachable host is worth
      #    more than the single-login flow it cost.
      #
      #    ⚠ method: https, and it MUST be. Zellij refuses to bind a non-loopback address
      #      without a certificate and offers no insecure override, so the target speaks TLS
      #      with a self-signed cert. Traefik reaches it anyway because its static config sets
      #      `serversTransport: insecureSkipVerify: true` — which is correct here rather than
      #      lazy: `.internal` is not a real TLD, so no CA can issue for that name and an
      #      internal CA was ruled out deliberately (Infrastructure/unifi/network.yaml).
      #
      #    ⚠ sso: true is NOT optional. Zellij's web server has no rate limiting and its docs
      #      state it assumes authenticated users are trusted. The Pangolin gate (and behind it
      #      Authentik over OIDC) is what makes exposing a shell defensible. Zellij then asks
      #      for its own token — two logins, accepted knowingly, because it has no OIDC and no
      #      forward-auth header to inject (zellij-org/zellij#4393 is open).
      #
      #    ⚠ Targeted by IP, not by name, for the same reason the SSH resource was: Newt resolves
      #      through DNS 9.9.9.9 per its own startup log, so shell.devops.chrison.internal does
      #      not resolve from the connector. Safe to pin — CT 3003 holds a UniFi reservation for
      #      this address, and the same reservation carries that internal name.
      #
      #    ⚠ REPLACING, not adding: the reconciler is add-only, so removing the old `Shell host`
      #      SSH resource here only stops it being re-created. It must be deleted ONCE by hand in
      #      Pangolin, or two front doors to the same shell stay open. Same footgun as the
      #      lab-zone Home Assistant twin above.
      - name: Shell host
        subdomain: shell
        zone: lab
        sso: true
        site: DevOps
        target: { ip: 10.10.135.221, port: 8082, method: https }

  # No `secrets:` block (avoids deriver fail-fast). The provisioner reads what it needs
  # straight from the gitignored secrets.env via ctx.Secrets:
  #   • CF_DNS_API_TOKEN (or CF_API_TOKEN) → injected into Traefik for the DNS-01 wildcard challenge.
  #   • PANGOLIN_API_KEY (org integration-API key, created post-setup) → resource reconcile;
  #     resources are skipped (not failed) until it exists.
  #   • PANGOLIN_LICENSE_KEY → activated ONCE by hand at /admin/license (UI-only).
  # server.secret is GENERATED + PRESERVED in config.yml on the CT by the provisioner.
