# Notification routing.
#
# NOTE: provisioning `policies` REPLACES the whole notification tree, so this is the root
# policy for the entire Grafana org, not an addition to it. That is deliberate — there were
# no other routes before this, and every alert should reach Home Assistant. Add sibling
# routes here rather than expecting an implicit default to still exist.
apiVersion: 1

policies:
  - orgId: 1
    receiver: home-assistant
    group_by: [alertname, name]
    group_wait: 30s
    group_interval: 5m
    # Slow: a UniFi problem that is still true four hours later has not become more urgent,
    # and this lands on a phone.
    repeat_interval: 4h
