# Alert delivery → Home Assistant.
#
# The URL is NOT in this file. Grafana expands $HA_ALERT_WEBHOOK_URL from the environment,
# fed by the `ha_alert_webhook_url` podman secret on the grafana quadlet — an HA webhook id
# is a capability (anyone on the LAN who knows it can fire the automation), so it lives in
# Bitwarden like every other secret here.
#
# The receiving end is the HA automation "Grafana alerts → notification", which raises a
# persistent notification. Swap that automation's action for your preferred notify service
# and every rule below follows automatically — nothing here needs to change.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: home-assistant
    receivers:
      - uid: ha-webhook
        type: webhook
        settings:
          url: $HA_ALERT_WEBHOOK_URL
          httpMethod: POST
        disableResolveMessage: false
