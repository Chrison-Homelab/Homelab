scrape_configs:
  - job_name: 'synology'
    static_configs:
      - targets: ['192.168.1.10']  # your DSM IP
    metrics_path: /snmp
    params:
      module: [synology]
  - job_name: 'servarr'
    static_configs:
      - targets: ['servarr_exporter:9707']
    metrics_path: /servarr
  # PowerOrchestrator metrics, re-exported by the OTel collector (#191).
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']