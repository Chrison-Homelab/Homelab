# OpenTelemetry Collector — receives OTLP from the power-orchestrator (and any future
# OTLP emitters) and fans out: metrics → Prometheus (scraped off :8889), traces → Tempo,
# logs → Loki. See stacks/PowerOrchestrator/README.md.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Prometheus scrapes these (see config/sample.prometheus.yml → job 'otel-collector').
  prometheus:
    endpoint: 0.0.0.0:8889
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Loki 3.x ingests OTLP natively at /otlp.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
