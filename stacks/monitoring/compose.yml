services:
  # --- *arr Prometheus exporters (exportarr — one instance per app). ---
  # Replaces the archived ghcr.io/onedr0p/servarr_exporter image. URLs + API keys
  # come from .env.local (RADARR_URL/RADARR_API_KEY, etc.); each is scraped by
  # prometheus on /metrics at its own port.
  exportarr-radarr:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: exportarr-radarr
    command: ["radarr"]
    environment:
      PORT: 9708
      URL: ${RADARR_URL}
      API_KEY: ${RADARR_API_KEY}
    ports:
      - "9708:9708"
    restart: unless-stopped

  exportarr-sonarr:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: exportarr-sonarr
    command: ["sonarr"]
    environment:
      PORT: 9709
      URL: ${SONARR_URL}
      API_KEY: ${SONARR_API_KEY}
    ports:
      - "9709:9709"
    restart: unless-stopped

  exportarr-prowlarr:
    image: ghcr.io/onedr0p/exportarr:latest
    container_name: exportarr-prowlarr
    command: ["prowlarr"]
    environment:
      PORT: 9710
      URL: ${PROWLARR_URL}
      API_KEY: ${PROWLARR_API_KEY}
    ports:
      - "9710:9710"
    restart: unless-stopped

  snmp_exporter:
    # Pinned: the snmp.yml config format is version-coupled to the exporter
    # (the 0.20 "auth split" broke the old version:/auth: module format). Keep
    # this in lockstep with the generator used to produce config/snmp.yml.
    image: prom/snmp-exporter:v0.30.1
    restart: unless-stopped
    ports:
      - "9116:9116"
    volumes:
      - ./config/snmp.yml:/etc/snmp_exporter/snmp.yml

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped

  # --- OpenTelemetry pipeline (PowerOrchestrator, ADR/#191) ---
  # OTLP in from the orchestrator → Prometheus (metrics) / Tempo (traces) / Loki (logs).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./config/otel-collector.yml:/etc/otelcol/config.yml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (scraped by prometheus)
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./config/tempo.yml:/etc/tempo/tempo.yml
      - ./data/tempo:/var/tempo
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./config/loki-config.yml:/etc/loki/loki-config.yml
      - ./data/loki:/loki
    restart: unless-stopped

  # --- Pulse: fleet monitoring (Proxmox cluster + per-host Docker agents). ---
  # UI on :7655. State (node config, agent registrations, admin creds, API token)
  # persists in ./data/pulse. Host agents are installed separately on each Docker
  # host (systemd pulse-agent) and report in to this server.
  pulse:
    image: rcourtman/pulse:latest
    container_name: pulse
    ports:
      - "7655:7655"
    volumes:
      - ./data/pulse:/data
    restart: unless-stopped

