# Gaming stack — GPU-passthrough VMs for play + ErpForFactoryGames testing.
#
# Owns VMID block 1000–1099 and the defaults its members inherit. Unlike the
# DevOps stack (community-scripts LXCs), members here are kind: VM provisioned by
# the ProxmoxSharp write path (#115, planned) — NOT by Deploy-Shape.ps1.
#
# Scope note: VMID 1001 (Plex-VM) falls inside this block but is HAND-MANAGED and
# INTENTIONALLY UNMANAGED by IaC (same precedent as CT 2005 in DevOps). 1002
# (gaming-vm-01 / Win11) and 1003 (gaming-vm-02 / Bazzite) are ADOPTED — see
# windows.vm.yaml and bazzite.vm.yaml. Validate against ../../Infrastructure/schema/shape.schema.json
# (kind: VM is a real vmSpec since #115 Phase A).
#
# VMID allocation policy: members set vmid EXPLICITLY (omission is an error).

apiVersion: homelab/v1
kind: Stack

metadata:
  name: Gaming
  tags: [gaming]

spec:
  ctidRange:
    start: 1000           # guard rail: a member vmid outside this block is rejected
    end: 1099             # 1001 in-range but unmanaged; 1002/1003 adopted
  defaults:
    node: desktop-01      # the only node with the discrete GPU (0000:09:00, no iGPU)
    timezone: Pacific/Auckland
    tags: [gaming]
    # VM-shape defaults (proven by the working Win11 VM 1002):
    #   machine: q35
    #   bios: ovmf
    #   cpu: host
    # left in the member shape until the vmSpec contract lands (#115 Phase A).
