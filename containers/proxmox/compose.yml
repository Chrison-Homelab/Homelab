# Simple single-node Proxmox configuration
# For detailed documentation, see README.md
# For a full cluster setup, use compose.cluster.yml instead

services:
  proxmox:
    container_name: proxmox-test
    image: longqtsea/containerized-proxmox
    privileged: true
    devices:
      - /dev/kvm
    ports:
      - 8006:8006
    volumes:
      - ./config:/var/lib/vz
    restart: unless-stopped