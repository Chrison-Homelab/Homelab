# Virtual Synology DSM Development Container
# For detailed documentation, see README.md
# 
# Platform Requirements:
# - Linux (x86_64) or Windows (x86_64) with KVM support
# - NOT compatible with macOS ARM64
#
# Quick Start:
#   docker-compose up -d
#   Access DSM at http://localhost:5000
#
# Default Password: See infra/ansible/group_vars/nas.yml

services:
  dsm:
    container_name: dsm
    image: vdsm/virtual-dsm
    environment:
      DISK_SIZE: "10G"
      DISK2_SIZE: "10G"
      DISK3_SIZE: "10G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 5000:5000
    volumes:
      - ./dsm:/storage
      - ./example2:/storage2
      - ./example3:/storage3
    restart: always
    stop_grace_period: 2m