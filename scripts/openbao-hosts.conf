# Hosts that read secrets from OpenBao with scripts/openbao-exec (#609, step 5).
# One line per host:   <host> <source CIDR> <KEY> [KEY...]
#
# The host's AppRole (host-<host>) can read EXACTLY these keys under secret/homelab/, nothing else,
# not even list. Its tokens and secret-id only work from <source CIDR>: the address the host uses
# to reach CT 3007 (`ip route get 10.10.30.7` on the host, the "src" field).
# After editing, re-run scripts/openbao-setup-host.sh <host> to apply the policy.
#
# hpe-01:
#   SOULVOICE_COOKIE                          soulvoice-attend.timer   (was /etc/soulvoice-attend.env)
#   QBIT_PASSWORD SONARR_API_KEY PLEX_TOKEN   seedonly-apply.timer     (was /root/seedonly/.env)
#   RADARR_API_KEY                            movie-migrate.timer      (was /root/movie-migrate/.env)
hpe-01 10.0.0.13/32 SOULVOICE_COOKIE QBIT_PASSWORD SONARR_API_KEY PLEX_TOKEN RADARR_API_KEY
