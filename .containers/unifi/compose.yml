# Local UniFi OS Server — a safe test target for UnifiSharp.
#
# Uses the community UniFi OS Server image (toquanghieu/unifi-os-server-docker),
# which packages Ubiquiti's current self-hosted UniFi OS Server. Unlike the old
# standalone Network Application, this has the **UniFi OS layer** — so its
# integration API is at /proxy/network/integration/v1, exactly like the live
# Cloud Gateway. It's also arm64-native (no emulation on Apple Silicon) and
# self-contained (no external MongoDB).
#
# Quick start (reproducible, no manual wizard):
#   ./bootstrap.sh          → up + scripted first-run setup + verify + write credentials.env
#   ./bootstrap.sh --reset  → wipe (down -v) and bootstrap from scratch
#
# See README.md — incl. why the legacy write API uses session (user/pass) auth.

services:
  unifi-os-server:
    image: hieutq/unifi-os-server:latest
    container_name: unifi-os-server
    cgroup: host            # UniFi OS Server runs systemd + ~10 internal services
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - CHOWN
      - SETUID
      - SETGID
      - KILL
      - SYS_CHROOT
      - SYS_PTRACE
      - SYS_RESOURCE
      - AUDIT_WRITE
      - MKNOD
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - unifi-data:/unifi
    ports:
      - "11443:443"        # GUI + API (https, self-signed)
      - "8080:8080"        # device communication
      - "3478:3478/udp"    # STUN
      - "10003:10003/udp"  # device discovery
    restart: unless-stopped

volumes:
  unifi-data:
