# Captured live config — qBittorrent CT 5007 (hpe-01), pulled 2026-06-25.
# Source path in CT: /root/.config/qBittorrent/qBittorrent.conf
# Sanitised: WebUI\Password_PBKDF2 redacted (set a fresh password on rebuild).
# This is a FAITHFUL CAPTURE of the live state. The explicit no-hit-and-run
# seeding policy (GlobalMax* = -1, ShareLimitAction=Stop) is now APPLIED on the
# live box and verified to survive qBittorrent's own save cycle — see README.md.
[Application]
FileLogger\Age=1
FileLogger\AgeType=1
FileLogger\Backup=true
FileLogger\DeleteOld=true
FileLogger\Enabled=true
FileLogger\MaxSizeBytes=66560
FileLogger\Path=/root/.local/share/qBittorrent/logs

[BitTorrent]
MergeTrackersEnabled=true
Session\AddTorrentStopped=false
Session\BTProtocol=TCP
Session\DefaultSavePath=/mnt/data/torrents
Session\DisableAutoTMMByDefault=false
Session\DisableAutoTMMTriggers\CategorySavePathChanged=false
Session\DisableAutoTMMTriggers\DefaultSavePathChanged=false
Session\ExcludedFileNames=
Session\GlobalMaxInactiveSeedingMinutes=-1
Session\GlobalMaxRatio=-1
Session\GlobalMaxSeedingMinutes=-1
Session\IgnoreLimitsOnLAN=true
Session\MaxConnections=-1
Session\MaxConnectionsPerTorrent=-1
Session\MaxUploads=-1
Session\MaxUploadsPerTorrent=-1
Session\Port=10647
Session\Preallocation=true
Session\QueueingSystemEnabled=false
Session\SSL\Port=32871
Session\ShareLimitAction=Stop
Session\UseCategoryPathsInManualMode=true
Session\uTPRateLimited=false

[Core]
AutoDeleteAddedTorrentFile=IfAdded

[LegalNotice]
Accepted=true

[Meta]
MigrationVersion=8

[Network]
Cookies=@Invalid()
PortForwardingEnabled=false
Proxy\HostnameLookupEnabled=false
Proxy\Profiles\BitTorrent=true
Proxy\Profiles\Misc=true
Proxy\Profiles\RSS=true

[Preferences]
General\Locale=en
MailNotification\req_auth=true
WebUI\AuthSubnetWhitelist=192.168.178.0/23, 10.0.0.0/16
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\CSRFProtection=false
WebUI\ClickjackingProtection=false
WebUI\HostHeaderValidation=false
WebUI\LocalHostAuth=false
WebUI\Password_PBKDF2=@@REDACTED — set on rebuild@@
WebUI\Port=8090
WebUI\SecureCookie=false
WebUI\UseUPnP=false
WebUI\Username=csimon

[RSS]
AutoDownloader\DownloadRepacks=true
AutoDownloader\SmartEpisodeFilter=s(\\d+)e(\\d+), (\\d+)x(\\d+), "(\\d{4}[.\\-]\\d{1,2}[.\\-]\\d{1,2})", "(\\d{1,2}[.\\-]\\d{1,2}[.\\-]\\d{4})"
