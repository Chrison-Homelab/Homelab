# Source of truth for the PR label taxonomy.
#
# GitHub reads this to auto-generate release notes, grouping merged PRs into the
# sections below by label. It is ALSO the canonical list of changelog labels that
# tooling and AI apply at PR-creation time — see docs/agents/issue-and-pr-style.md.
#
# NOTE FOR THIS REPO: Homelab publishes no releases today. This file is adopted for
# the shared label taxonomy (matching Fallout and Krautwatch) and so notes work the
# day they are wanted — not because anything generates them yet. Unlike Fallout,
# there are no `target/v*` process labels here.
#
# When raising a PR: apply the ONE category label that matches the change, in the
# same `gh pr create` call. Repo-specific labels (iac, networking, proxmox, unifi,
# synology, hardware, ci-cd, cleanup, blocked, priority:*) are additive and do not
# affect grouping. A PR with no category label falls through to "Other Changes" —
# prefer a real category.
changelog:
  exclude:
    labels:
      # skip-changelog: housekeeping with no consumer-facing note (CI, tooling,
      # internal refactors, submodule pointer bumps). Keeps the notes signal-heavy.
      - skip-changelog
      # dependencies: version bumps — folded out of the notes as noise. Also a
      # category below, so the label is documented once; the exclude wins.
      # ⚠ A PR carrying `security` AND `dependencies` disappears entirely.
      # A dependency bump that fixes a CVE gets `security` alone.
      - dependencies
    authors:
      - dependabot
  categories:
    # breaking-change: removes or renames something others depend on — a shape's
    # ctid, an engine CLI flag, a converge contract, an on-disk format.
    - title: "⚠️ Breaking Changes"
      labels:
        - breaking-change
    # enhancement: a new capability.
    - title: "✨ New Features"
      labels:
        - enhancement
    # bug: fixes incorrect behaviour.
    - title: "🐛 Bug Fixes"
      labels:
        - bug
    # security: fixes a vulnerability or hardens a security-sensitive surface.
    - title: "🔒 Security"
      labels:
        - security
    # dependencies: version bumps (excluded above — kept for completeness).
    - title: "📦 Dependencies"
      labels:
        - dependencies
    # documentation: docs, comments, ADRs, and agent-instruction changes only.
    - title: "📖 Documentation"
      labels:
        - documentation
    # Fallback for PRs carrying none of the labels above — don't rely on it.
    - title: "Other Changes"
