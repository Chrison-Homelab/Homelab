name: publish-schema

# Phase 0 / ADR-0008 — publish the shape contract + a PORTABLE validator so
# standalone Homelab.Stacks.* repos can validate their own shapes in CI.
#
# Publishes two assets to a GitHub Release:
#   - shape.schema.json                     (the canonical contract, for humans/tools)
#   - homelab-validate-linux-x64.tar.gz     (the SAME C# engine, self-contained single
#                                            file + schema beside it — ADR-0001's one
#                                            validator, made portable; runs anywhere,
#                                            no .NET SDK / private feeds / self-hosted)
#
# INTERIM (#275): the packaging + `gh release` steps below are hand-rolled in
# shell only because Fallout has no native publish/release capability yet. Once
# it does, this shrinks to `./build.sh <target>` (like validate-shapes.yml).
#
# VERSIONING — tracks the shapes' apiVersion (homelab/v1):
#   - `schema-v1` is a MOVING channel refreshed on every relevant main push.
#     Consumers pin `@schema-v1` (breaking contract change → a new `schema-v2`).
#   - workflow_dispatch with `version` also cuts an immutable point release
#     (e.g. `schema-v1.0.0`) for anyone who wants to pin exactly.

on:
  push:
    branches: [main]
    paths:
      - 'Infrastructure/schema/**'
      - 'Infrastructure/engine/**'
      - 'build/**'
      - '.github/workflows/publish-schema.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional immutable point release tag (e.g. schema-v1.0.0). Leave blank to only refresh the moving schema-v1 channel.'
        required: false
        type: string
      notes:
        description: 'Release notes for the point release.'
        required: false
        type: string

permissions:
  contents: write            # create tags + GitHub Releases

jobs:
  build:
    # Self-hosted for the .NET 10 SDK that is already on that host, not for feed access:
    # since #390 every package restores publicly from nuget.org. This could move to
    # ubuntu-latest with a setup-dotnet step if the runner ever becomes the bottleneck.
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v6
        # No submodules: the engine + schema are superproject content.
      - name: Publish the portable validator (self-contained linux-x64 + schema beside)
        run: ./build.sh PublishValidator
      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C publish/validator -czf dist/homelab-validate-linux-x64.tar.gz .
          cp Infrastructure/schema/shape.schema.json dist/shape.schema.json
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: schema-dist
          path: dist/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest     # gh preinstalled; no build here, just publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: schema-dist
          path: dist
      - name: Refresh the moving schema-v1 channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHANNEL=schema-v1
          R="$GITHUB_REPOSITORY"
          NOTES="Moving channel for \`homelab/v1\` shapes. Pin consumers to \`@$CHANNEL\`. Source commit \`$GITHUB_SHA\`."
          # NON-DESTRUCTIVE (#396). The old delete + recreate raced GitHub's ASYNC asset
          # cleanup: deleting the release (with --cleanup-tag) and immediately recreating the
          # same tag left the new release with its assets stuck in a non-downloadable state, so
          # `gh release download` on every stack repo returned "no assets to download" and all
          # their CI broke — while THIS job still reported success. Never delete the release.
          # Instead: ensure it exists, move the moving-channel tag via the API (no checkout in
          # this job), and clobber the assets in place.
          if gh release view "$CHANNEL" --repo "$R" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$R/git/refs/tags/$CHANNEL" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit "$CHANNEL" --repo "$R" --notes "$NOTES"
          else
            gh release create "$CHANNEL" --repo "$R" \
              --title "Shape contract + validator ($CHANNEL — moving, homelab/v1)" \
              --notes "$NOTES" --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload "$CHANNEL" \
            dist/shape.schema.json \
            dist/homelab-validate-linux-x64.tar.gz \
            --repo "$R" --clobber
          # Fail loudly if the assets aren't actually retrievable — the old failure mode was a
          # green job over an empty release. Prove a fresh download sees both.
          for a in shape.schema.json homelab-validate-linux-x64.tar.gz; do
            gh release view "$CHANNEL" --repo "$R" --json assets \
              --jq '.assets[].name' | grep -qx "$a" \
              || { echo "::error::$CHANNEL is missing asset $a after publish"; exit 1; }
          done
      - name: Cut an immutable point release (dispatch with a version)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ inputs.version }}" \
            dist/shape.schema.json \
            dist/homelab-validate-linux-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Shape contract + validator ${{ inputs.version }}" \
            --notes "${{ inputs.notes || 'Immutable schema + validator release.' }}" \
            --target "$GITHUB_SHA"
