name: discover-drift

# Auto-detects Proxmox cluster changes and documents them: runs the hub engine
# (which consumes the ProxmoxSharp package) against the live cluster, refreshes
# docs/discovered-state.json, and opens a PR when it drifts from what's committed.
#
# Runs on the homelab self-hosted runner (same as the Fallout deploy pipeline) so
# it reaches the cluster directly over the LAN — NOT via the public, now
# CF-Access-gated `proxmox.chrison.dev` hostname. This sidesteps the Cloudflare WAF
# (which 403s datacenter/runner IPs) that blocked GitHub-hosted runners before.
#
# Package restore uses the built-in GITHUB_TOKEN — no PAT needed (the engine only
# restores same-org ProxmoxSharp*; the cross-org Fallout feed is build/-only). The
# ProxmoxSharp + ProxmoxSharp.Api packages must grant this repo read access:
# each package → Package settings → Manage Actions access → add Chrison-dev/Homelab (Read).
#
# Cluster-reach secrets are shared with _deploy-stack.yml (PROXMOX_BASE_URL points
# at the LAN, PROXMOX_VERIFY_TLS=false for the self-signed direct cert):
#   PROXMOX_BASE_URL  PROXMOX_TOKEN_ID  PROXMOX_TOKEN_SECRET  PROXMOX_VERIFY_TLS

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  discover:
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v6

      # No setup-dotnet: the homelab runner already has the .NET 10 SDK on PATH
      # (same host the Fallout deploy pipeline runs build.sh on; see global.json).

      - name: Discover live state
        env:
          # nuget.config reads this for the GitHub Packages feed; the built-in
          # token works once the packages grant this repo read access.
          GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
          # Cluster-reach config shared with _deploy-stack.yml — LAN-direct, so
          # PROXMOX_VERIFY_TLS comes from the secret (false for the self-signed cert).
          PROXMOX_BASE_URL: ${{ secrets.PROXMOX_BASE_URL }}
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
          PROXMOX_VERIFY_TLS: ${{ secrets.PROXMOX_VERIFY_TLS }}
        run: |
          dotnet run --project Infrastructure/engine -c Release -v quiet -- discover \
            > docs/discovered-state.json

      - name: Open PR on drift
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/discovered-state
          title: 'chore: refresh discovered Proxmox state'
          commit-message: 'chore: refresh docs/discovered-state.json from live cluster'
          body: |
            Automated discovery against the live cluster (LAN-direct from the
            homelab self-hosted runner) detected drift. Review the diff in
            `docs/discovered-state.json` to see what changed (nodes, LXCs/VMs,
            storage, network).
          add-paths: docs/discovered-state.json
          delete-branch: true
