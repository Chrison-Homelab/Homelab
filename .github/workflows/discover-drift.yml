name: discover-drift

# Auto-detects Proxmox cluster changes and documents them: runs the hub engine
# (which consumes the ProxmoxSharp package) against the live cluster, refreshes
# docs/discovered-state.json, and opens a PR when it drifts from what's committed.
#
# Runs on the homelab self-hosted runner (same as the Fallout deploy pipeline) so
# it reaches the cluster directly over the LAN — NOT via the public, now
# CF-Access-gated `proxmox.chrison.dev` hostname. This sidesteps the Cloudflare WAF
# (which 403s datacenter/runner IPs) that blocked GitHub-hosted runners before.
#
# Package restore needs no credential at all since #390 — every package this repo builds
# comes publicly from nuget.org (Fallout 10.4 and Chrison.ProxmoxSharp/UnifiSharp alike).
#
# Cluster reach comes from OpenBao (#609): GitHub OIDC → JWT role `discover`, which may read
# PROXMOX_TOKEN_SECRET and nothing else, and only from this file on main. PROXMOX_BASE_URL,
# PROXMOX_TOKEN_ID and PROXMOX_VERIFY_TLS are not secrets; they are the committed literals in
# secrets.env.template. If OpenBao is unavailable the run fails (no GitHub-secrets fallback since #609).
#
# DRIFT_PR_PAT: fine-grained PAT scoped to THIS repo (contents: write +
# pull-requests: write) for the "Open PR on drift" step. Deliberately a scoped
# PAT rather than the org-wide "Allow Actions to create and approve PRs" toggle,
# to keep the blast radius minimal.

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read
  id-token: write   # GitHub OIDC → OpenBao JWT login (role discover)

jobs:
  discover:
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v6

      # No setup-dotnet: the homelab runner already has the .NET 10 SDK on PATH
      # (same host the Fallout deploy pipeline runs build.sh on; see global.json).

      # ⚠ This repo is PUBLIC, so these logs are public: the script masks every value before use.
      - name: Proxmox credentials from OpenBao (GitHub OIDC → JWT role discover)
        env:
          OPENBAO_ROLE: discover
          OPENBAO_KEYS: PROXMOX_BASE_URL PROXMOX_TOKEN_ID PROXMOX_TOKEN_SECRET PROXMOX_VERIFY_TLS
        run: scripts/ci-secrets-from-openbao.sh

      - name: Discover live state
        run: |
          # Keep the committed snapshot so the next step can diff against it.
          mkdir -p "$RUNNER_TEMP/drift"
          cp docs/discovered-state.json "$RUNNER_TEMP/drift/before.json" \
            || echo '{"nodes":[]}' > "$RUNNER_TEMP/drift/before.json"
          dotnet run --project Infrastructure/engine -c Release -v quiet -- discover \
            > docs/discovered-state.json

      - name: Summarize drift
        id: summary
        # Render a Markdown table of what changed (committed → live) for the PR body.
        run: |
          {
            echo 'body<<DRIFT_EOF'
            echo 'Automated discovery against the live cluster (LAN-direct from the homelab self-hosted runner) detected drift from the committed state.'
            echo ''
            dotnet run --project Infrastructure/engine -c Release -v quiet -- discover-diff \
              "$RUNNER_TEMP/drift/before.json" docs/discovered-state.json
            echo ''
            echo '<sub>Full machine-readable state: `docs/discovered-state.json` in this PR.</sub>'
            echo 'DRIFT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open PR on drift
        uses: peter-evans/create-pull-request@v8
        with:
          # Scoped fine-grained PAT (this repo only: contents:write + pull-requests:write)
          # so we don't depend on the org-wide "Actions can create PRs" toggle.
          token: ${{ secrets.DRIFT_PR_PAT }}
          branch: chore/discovered-state
          title: '[Proxmox Discovery] refresh discovered cluster state'
          commit-message: 'chore: refresh docs/discovered-state.json from live cluster'
          labels: proxmox-discovery
          body: ${{ steps.summary.outputs.body }}
          add-paths: docs/discovered-state.json
          delete-branch: true
