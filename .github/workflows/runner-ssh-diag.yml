name: runner-ssh-diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: [self-hosted, homelab]
    steps:
      - name: Surface the job's actual SSH pubkey + mount info
        run: |
          echo "=====JOB PUBKEY====="
          cat /home/runner/.ssh/id_ed25519.pub
          echo "=====END JOB PUBKEY====="
          echo "== key inode/realpath =="
          stat -c '%i %y %n' /home/runner/.ssh/id_ed25519
          realpath /home/runner/.ssh/id_ed25519
          echo "== mounts touching /home or overlay =="
          findmnt /home/runner 2>&1 || true
          mount | grep -iE "overlay|/home|runner" | head
