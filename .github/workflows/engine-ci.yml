name: engine-ci
on:
  pull_request:
    paths: ['Infrastructure/engine/**', 'nuget.config', '.github/workflows/engine-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: [self-hosted, homelab]
    env:
      GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}   # NuGet org feed auth (nuget.config)
      DOTNET_ROOT: /usr/local/dotnet                      # .NET SDK pre-installed on the runner
    steps:
      - uses: actions/checkout@v6
      # The engine floats to ProxmoxSharp 0.1.0-preview.* (republished on every
      # push to main). The self-hosted runner reuses its workspace + NuGet cache,
      # which otherwise pins the float to a stale older preview. Clear the caches
      # AND wipe obj/bin so restore re-resolves the newest published version and
      # the build can't compile against a stale extracted package.
      - run: dotnet nuget locals all --clear
      - run: rm -rf Infrastructure/engine/obj Infrastructure/engine/bin Infrastructure/engine.Tests/obj Infrastructure/engine.Tests/bin
      - run: dotnet restore Infrastructure/engine/Homelab.Infrastructure.csproj --no-http-cache
      - run: dotnet list Infrastructure/engine/Homelab.Infrastructure.csproj package   # diagnostic: resolved versions
      - run: dotnet build Infrastructure/engine/Homelab.Infrastructure.csproj -c Release --no-restore
