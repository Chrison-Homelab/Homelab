name: engine-ci
on:
  pull_request:
    paths: ['Infrastructure/engine/**', 'nuget.config', '.github/workflows/engine-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: [self-hosted, homelab]
    env:
      GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}   # NuGet org feed auth (nuget.config)
      DOTNET_ROOT: /usr/local/dotnet                      # .NET SDK pre-installed on the runner
    steps:
      - uses: actions/checkout@v6
      # Floating prerelease deps (ProxmoxSharp 0.1.0-preview.*, republished on
      # every push to main) need a fresh resolve: --force re-evaluates the float
      # from scratch (the self-hosted runner otherwise reuses a cached resolution
      # pinned to an older preview), --no-http-cache re-queries the feed index.
      - run: dotnet restore Infrastructure/engine/Homelab.Infrastructure.csproj --force --no-http-cache
      - run: dotnet build Infrastructure/engine/Homelab.Infrastructure.csproj -c Release --no-restore
