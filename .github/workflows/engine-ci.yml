name: engine-ci
on:
  pull_request:
    paths: ['Infrastructure/engine/**', 'nuget.config', '.github/workflows/engine-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: [self-hosted, homelab]
    env:
      # NuGet (nuget.config) reads the org GitHub Packages feed via this var.
      GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore Infrastructure/engine/Homelab.Infrastructure.csproj
      - run: dotnet build Infrastructure/engine/Homelab.Infrastructure.csproj -c Release --no-restore
