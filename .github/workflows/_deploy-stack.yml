name: _deploy-stack
# Reusable per-stack deploy pipeline (Fallout). Called by deploy-<stack>.yml —
# one caller per stack ("one pipeline per stack", DRY). Runs on the homelab
# self-hosted runner because Preview/Deploy need cluster reach (Proxmox API +
# SSH to nodes) and the Fallout-build/chrison-dev package feeds.
on:
  workflow_call:
    inputs:
      stack:
        description: 'Stack name (directory under stacks/).'
        required: true
        type: string
      apply:
        description: 'true = live Deploy (converge --apply); false = Preview only.'
        required: false
        type: boolean
        default: false
      only:
        description: 'Restrict the converge to these stack members (comma-separated). Empty = whole stack.'
        required: false
        type: string
        default: ''
jobs:
  pipeline:
    runs-on: [self-hosted, homelab]
    concurrency:
      group: deploy-${{ inputs.stack }}
      cancel-in-progress: false        # never cancel an in-flight converge
    env:
      # Cluster read (Preview state-diff) + create/config (Deploy).
      PROXMOX_BASE_URL: ${{ secrets.PROXMOX_BASE_URL }}
      PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
      PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
      PROXMOX_VERIFY_TLS: ${{ secrets.PROXMOX_VERIFY_TLS }}
      # Cloudflare tunnel-token provider (cloudflared shapes) — ADD-ONLY (CLAUDE.md).
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # Home edge addressing, expanded into spec.config by ShapeVars (`${HOME_WAN_IP}`).
      # SECRETS, not `vars.*`, on purpose: this repo is public, so its Actions logs are
      # public, and converge PRINTS publicIp in Preview ("ensure grey-cloud A record(s)
      # … → <ip>"). GitHub masks secrets in logs and does not mask variables — a variable
      # would have moved the literal out of the shape and straight into the build log.
      # Consumed by Core (pangolin publicIp + cloudflared access.bypass) and Media
      # (cloudflared access.bypass). An unset value fails the load LOUDLY, by name.
      HOME_WAN_IP: ${{ secrets.HOME_WAN_IP }}
      HOME_WAN_IPV6_PREFIX: ${{ secrets.HOME_WAN_IPV6_PREFIX }}
      # Pangolin EE (Core): the chrison-dev org integration-API key the pangolin provisioner
      # uses to upsert resources via the CT's :3003 API. Without it, declared resources are
      # SKIPPED (wildcard A records still get created). Repo secret: PANGOLIN_API_KEY.
      PANGOLIN_API_KEY: ${{ secrets.PANGOLIN_API_KEY }}
      # arr-wire (#159): qBittorrent WebUI creds the Media provisioner sets + that
      # sonarr/radarr use as download-client auth. QBIT_USER defaults to 'admin' if unset.
      QBIT_USER: ${{ secrets.QBIT_USER }}
      QBIT_PASSWORD: ${{ secrets.QBIT_PASSWORD }}
      # *arr WebUI Forms-auth creds the provisioners set (per-app passwords, #178).
      ARR_USER: ${{ secrets.ARR_USER }}
      SONARR_PASSWORD: ${{ secrets.SONARR_PASSWORD }}
      RADARR_PASSWORD: ${{ secrets.RADARR_PASSWORD }}
      PROWLARR_PASSWORD: ${{ secrets.PROWLARR_PASSWORD }}
      BAZARR_PASSWORD: ${{ secrets.BAZARR_PASSWORD }}
      BAZARR_OPENSUBTITLES_USER: ${{ secrets.BAZARR_OPENSUBTITLES_USER }}
      BAZARR_OPENSUBTITLES_PASSWORD: ${{ secrets.BAZARR_OPENSUBTITLES_PASSWORD }}

      # Podman-host secrets. PodmanProvisioner resolves every one of these BEFORE building the
      # converge script and fails the whole run if any is absent or empty, rather than creating an
      # empty podman secret the units would silently mis-consume. None of them were passed here, so
      # a CI deploy of a stack with a podman host could not converge it at all — the failure names
      # the missing key, which is how it was found.
      #
      # SecretsEnv falls back to the process environment when there is no secrets.env file, which is
      # the case on a runner. So these env names must match the secrets.env keys exactly.
      PODMAN_USER_PASSWORD: ${{ secrets.PODMAN_USER_PASSWORD }}
      YOUTARR_DB_ROOT_PASSWORD: ${{ secrets.YOUTARR_DB_ROOT_PASSWORD }}
      YOUTARR_AUTH_USERNAME: ${{ secrets.YOUTARR_AUTH_USERNAME }}
      YOUTARR_AUTH_PASSWORD: ${{ secrets.YOUTARR_AUTH_PASSWORD }}
      KRAUTWATCH_DB_PASSWORD: ${{ secrets.KRAUTWATCH_DB_PASSWORD }}
      KRAUTWATCH_DB_CONNECTIONSTRING: ${{ secrets.KRAUTWATCH_DB_CONNECTIONSTRING }}
      KRAUTWATCH_APIKEY: ${{ secrets.KRAUTWATCH_APIKEY }}
      KRAUTWATCH_TVDB_APIKEY: ${{ secrets.KRAUTWATCH_TVDB_APIKEY }}
      # shelfmark (#186 follow-up): Hardcover metadata-provider API token the provisioner
      # writes into /etc/shelfmark/.env. From the BW hardcover.app item.
      HARDCOVER_API_KEY: ${{ secrets.HARDCOVER_API_KEY }}
      # Authentik, the IdP on Core CT 2014 (#469). Seeded as podman secrets by the provisioner,
      # which FAILS the member rather than creating an empty secret the units would silently
      # mis-consume — the same guard PODMAN_USER_PASSWORD above documents, and the same way
      # this was found: adding the keys to secrets.env.template covers a local converge but
      # NOT the runner, which has no secrets.env and reads these env names instead.
      AUTHENTIK_SECRET_KEY: ${{ secrets.AUTHENTIK_SECRET_KEY }}
      AUTHENTIK_PG_PASSWORD: ${{ secrets.AUTHENTIK_PG_PASSWORD }}
      AUTHENTIK_PANGOLIN_CLIENT_ID: ${{ secrets.AUTHENTIK_PANGOLIN_CLIENT_ID }}
      AUTHENTIK_PANGOLIN_CLIENT_SECRET: ${{ secrets.AUTHENTIK_PANGOLIN_CLIENT_SECRET }}
      AUTHENTIK_PULSE_CLIENT_ID: ${{ secrets.AUTHENTIK_PULSE_CLIENT_ID }}
      AUTHENTIK_PULSE_CLIENT_SECRET: ${{ secrets.AUTHENTIK_PULSE_CLIENT_SECRET }}
      AUTHENTIK_GRAFANA_CLIENT_ID: ${{ secrets.AUTHENTIK_GRAFANA_CLIENT_ID }}
      AUTHENTIK_GRAFANA_CLIENT_SECRET: ${{ secrets.AUTHENTIK_GRAFANA_CLIENT_SECRET }}
      AUTHENTIK_FORGEJO_CLIENT_ID: ${{ secrets.AUTHENTIK_FORGEJO_CLIENT_ID }}
      AUTHENTIK_FORGEJO_CLIENT_SECRET: ${{ secrets.AUTHENTIK_FORGEJO_CLIENT_SECRET }}
      # DevOps stack. The github-runner member derives its registration token from this PAT,
      # and it had never been passed to the runner — the same gap as the four monitoring
      # secrets in #490, found the same way: the first live apply of that stack in a while.
      # A stack that deploys fine by hand goes red the moment CI touches it, because the
      # laptop already had a populated secrets.env and the runner has none.
      GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
      # monitoring stack (#485). These four were never here because monitoring had no
      # workflow to need them — every apply ran from a laptop that already had secrets.env,
      # so nothing ever noticed. Adding deploy-monitoring.yml made the runner the first
      # environment to converge that stack, and it failed on the first one it reached:
      #   FAILED: podman secret 'grafana_admin_password' needs GF_SECURITY_ADMIN_PASSWORD
      #           in secrets.env (absent/empty)
      # Note the seeding is add-only but still HARD-FAILS on an absent source value, even
      # when the podman secret already exists on the host — so a missing passthrough breaks
      # the whole stack's converge, not just the one unit that uses it.
      GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
      RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
      SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
      PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
      # UniFi, for the DHCP-reservation reconciler (#416, #446). Without these every declared
      # reservation reports `reservation SKIPPED: ... no UniFi credentials` and the run still
      # goes GREEN — so the shapes look reconciled while the controller has never heard of
      # them. Only the API key is secret; the rest are the same literals secrets.env carries.
      # The controller is addressed by IP on purpose: it IS the DNS server.
      UNIFI_API_KEY: ${{ secrets.UNIFI_API_KEY }}
      # Alert bus delivery (ADR-0011). Seeding is add-only but HARD-FAILS on an absent source
      # value even when the podman secret already exists on the host, so a missing passthrough
      # here fails the WHOLE stack converge, not just alertmanager.
      HA_ALERT_WEBHOOK_URL: ${{ secrets.HA_ALERT_WEBHOOK_URL }}
      UNIFI_LOCAL_HOST: '192.168.178.1'
      UNIFI_BASE_URL: 'https://192.168.178.1/proxy/network/integration'
      UNIFI_VERIFY_TLS: 'false'
      # NB: SSH to nodes for the community-scripts create path is provided by the
      # runner host (proven by the BL-013 smoke deploy), not a GH secret.
      # The runner has no DNS for node SHORT names (those live in each node's
      # /etc/hosts, not in DNS), so map each to its FQDN — NodeExec reads
      # NODE_ADDR_<NAME> and SSHes there (issue #162).
      #
      # FQDNs, not IPs, since #37: the nodes moved to VLAN 1000 on 2026-08-02 and
      # these records are UniFi local-DNS entries, so a future re-address needs no
      # change here. Verified resolvable from the runner (CT 3002). Non-secret.
      NODE_ADDR_HPE_01: 'hpe-01.homelab.chrison.internal'
      NODE_ADDR_NUC_01: 'nuc-01.homelab.chrison.internal'
      NODE_ADDR_DESKTOP_01: 'desktop-01.homelab.chrison.internal'
      # The runner runs jobs with a HOME that isn't the login home, so NodeExec can't
      # find the SSH identity in ~/.ssh — point it at the runner's key explicitly (#162).
      NODE_SSH_KEY: /home/runner/.ssh/id_ed25519
    steps:
      - uses: actions/checkout@v6
      - name: Fetch stack submodules (shapes live here; vendor/* C# repos skipped)
        env:
          TOKEN: ${{ secrets.SUBMODULES_RO_PAT }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          paths=$(git config --file .gitmodules --get-regexp path | awk '{print $2}' | grep '^stacks/')
          git submodule update --init $paths
          git config --global --unset-all url."https://x-access-token:${TOKEN}@github.com/".insteadOf || true
      - name: Preview (dry-run — validate + plan, no mutation)
        run: ./build.sh Preview --stack ${{ inputs.stack }}${{ inputs.only && format(' --only {0}', inputs.only) || '' }}
      - name: Deploy (LIVE apply)
        if: ${{ inputs.apply }}
        run: ./build.sh Deploy --stack ${{ inputs.stack }}${{ inputs.only && format(' --only {0}', inputs.only) || '' }}
