name: _deploy-stack
# Reusable per-stack deploy pipeline (Fallout). Called by deploy-<stack>.yml —
# one caller per stack ("one pipeline per stack", DRY). Runs on the homelab
# self-hosted runner because Preview/Deploy need cluster reach (Proxmox API +
# SSH to nodes) and the Fallout-build/chrison-dev package feeds.
on:
  workflow_call:
    inputs:
      stack:
        description: 'Stack name (directory under stacks/).'
        required: true
        type: string
      apply:
        description: 'true = live Deploy (converge --apply); false = Preview only.'
        required: false
        type: boolean
        default: false
jobs:
  pipeline:
    runs-on: [self-hosted, homelab]
    concurrency:
      group: deploy-${{ inputs.stack }}
      cancel-in-progress: false        # never cancel an in-flight converge
    env:
      # Restore (Fallout-build + chrison-dev GitHub Packages — cross-org, needs a real PAT).
      # Secret is PACKAGES_PAT (GitHub forbids the GITHUB_ prefix); nuget.config
      # reads it via %GITHUB_PACKAGES_PAT%.
      GITHUB_PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
      # Cluster read (Preview state-diff) + create/config (Deploy).
      PROXMOX_BASE_URL: ${{ secrets.PROXMOX_BASE_URL }}
      PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
      PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
      PROXMOX_VERIFY_TLS: ${{ secrets.PROXMOX_VERIFY_TLS }}
      # Cloudflare tunnel-token provider (cloudflared shapes) — ADD-ONLY (CLAUDE.md).
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      # arr-wire (#159): qBittorrent WebUI creds the Media provisioner sets + that
      # sonarr/radarr use as download-client auth. QBIT_USER defaults to 'admin' if unset.
      QBIT_USER: ${{ secrets.QBIT_USER }}
      QBIT_PASSWORD: ${{ secrets.QBIT_PASSWORD }}
      # *arr WebUI Forms-auth creds the provisioners set (per-app passwords, #178).
      ARR_USER: ${{ secrets.ARR_USER }}
      SONARR_PASSWORD: ${{ secrets.SONARR_PASSWORD }}
      RADARR_PASSWORD: ${{ secrets.RADARR_PASSWORD }}
      PROWLARR_PASSWORD: ${{ secrets.PROWLARR_PASSWORD }}
      # NB: SSH to nodes for the community-scripts create path is provided by the
      # runner host (proven by the BL-013 smoke deploy), not a GH secret.
      # The runner has no DNS for node short-names, so map each to its LAN IP —
      # NodeExec reads NODE_ADDR_<NAME> and SSHes straight to the IP (issue #162).
      # IPs are internal/non-secret (also in docs/Services.md, discovered-state.json).
      NODE_ADDR_HPE_01: '192.168.179.3'
      NODE_ADDR_NUC_01: '192.168.179.1'
      NODE_ADDR_DESKTOP_01: '192.168.179.2'
      # The runner runs jobs with a HOME that isn't the login home, so NodeExec can't
      # find the SSH identity in ~/.ssh — point it at the runner's key explicitly (#162).
      NODE_SSH_KEY: /home/runner/.ssh/id_ed25519
    steps:
      - uses: actions/checkout@v6
      - name: Fetch stack submodules (shapes live here; vendor/* C# repos skipped)
        env:
          TOKEN: ${{ secrets.SUBMODULES_RO_PAT }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          paths=$(git config --file .gitmodules --get-regexp path | awk '{print $2}' | grep '^stacks/')
          git submodule update --init $paths
          git config --global --unset-all url."https://x-access-token:${TOKEN}@github.com/".insteadOf || true
      - name: Preview (dry-run — validate + plan, no mutation)
        run: ./build.sh Preview --stack ${{ inputs.stack }}
      - name: Deploy (LIVE apply)
        if: ${{ inputs.apply }}
        run: ./build.sh Deploy --stack ${{ inputs.stack }}
