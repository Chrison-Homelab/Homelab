name: runner-ssh-key
# One-shot helper: ensure the self-hosted runner has an SSH keypair (as the user the
# Actions service runs as — the same identity NodeExec uses for `ssh root@<node>`) and
# print its PUBLIC key, so it can be authorized on the Proxmox hosts for converge --apply.
# Prints only the public half; the private key never leaves the runner. See issue/runbook.
on:
  workflow_dispatch:
jobs:
  key:
    runs-on: [self-hosted, homelab]
    steps:
      - name: Ensure + show the runner's SSH public key
        run: |
          set -euo pipefail
          echo "runner service user: $(whoami)   home: $HOME"
          KEY="$HOME/.ssh/id_ed25519"
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          if [ ! -f "$KEY" ]; then
            ssh-keygen -t ed25519 -N "" -C "homelab-runner@$(hostname)" -f "$KEY"
            echo "→ generated a new keypair"
          else
            echo "→ keypair already present"
          fi
          echo "=====BEGIN RUNNER PUBKEY====="
          cat "$KEY.pub"
          echo "=====END RUNNER PUBKEY====="
