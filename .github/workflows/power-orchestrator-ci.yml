# power-orchestrator-ci — build + test the PowerOrchestrator service (#191) via Fallout.
#
# tools/PowerOrchestrator is a .NET service (not a converge-able stack), so it gets its own
# CI rather than the per-stack deploy pipeline. Runs the Fallout TestPowerOrchestrator target
# (compile → test), keeping one build entrypoint for the whole repo (ADR-0001).
name: power-orchestrator-ci
on:
  pull_request:
    paths:
      - 'tools/PowerOrchestrator/**'
      - 'build/**'
      - 'nuget.config'
      - 'global.json'
      - '.github/workflows/power-orchestrator-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v6
      # The homelab runner already has the .NET 10 SDK on PATH (see global.json); no setup-dotnet.
      - run: ./build.sh TestPowerOrchestrator
