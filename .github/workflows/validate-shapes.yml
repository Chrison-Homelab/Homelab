name: validate-shapes
on:
  pull_request:
    paths: ['Infrastructure/**', 'stacks/**', 'build/**', 'nuget.config', 'global.json', '.github/workflows/validate-shapes.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: [self-hosted, homelab]
    env:
      # Fallout (Fallout-build feed) + ProxmoxSharp/UnifiSharp (chrison-dev feed)
      # restore both need GitHub Packages read across two orgs — the default
      # GITHUB_TOKEN can't (cross-org), so a real PAT is required. The secret is
      # PACKAGES_PAT (GitHub forbids the reserved GITHUB_ prefix on secret names);
      # nuget.config reads it via the %GITHUB_PACKAGES_PAT% env var.
      GITHUB_PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
    steps:
      - uses: actions/checkout@v6
      - name: Fetch stack submodules (shapes live here; vendor/* C# repos skipped)
        env:
          TOKEN: ${{ secrets.SUBMODULES_RO_PAT }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          paths=$(git config --file .gitmodules --get-regexp path | awk '{print $2}' | grep '^stacks/')
          git submodule update --init $paths
          git config --global --unset-all url."https://x-access-token:${TOKEN}@github.com/".insteadOf || true
      # Replaces the former `python3 tools/validate-shapes.py`: the Fallout
      # ValidateShapes target drives the C# engine's `validate` (one validator,
      # one language end-to-end — ADR-0001).
      - run: ./build.sh ValidateShapes
