name: deploy-media
# One pipeline per stack (ADR-0005 stacks / ADR-0001 Fallout). PR touching the
# stack → Preview (dry-run). Manual dispatch with apply=true → live Deploy.
on:
  pull_request:
    paths:
      - 'stacks/Media/**'
      # ⚠ BOTH FORMS, because Media is a SUBMODULE. A pointer bump changes the path
      # `stacks/Media` with nothing after it, and `stacks/Media/**` requires a trailing
      # segment — so the glob alone silently never matches the commits that actually change
      # what this stack deploys. The bare entry is what catches the bump bot's commits.
      - 'stacks/Media'
      - 'Infrastructure/**'
      - 'build/**'
      - 'nuget.config'
      - 'global.json'
      - '.github/workflows/deploy-media.yml'
      - '.github/workflows/_deploy-stack.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Live apply (leave unchecked for Preview only).'
        type: boolean
        default: false
      only:
        description: 'Restrict to these stack members (comma-separated, e.g. podman-host). Empty = whole stack.'
        type: string
        default: ''
jobs:
  deploy:
    uses: ./.github/workflows/_deploy-stack.yml
    with:
      stack: Media
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
      only: ${{ github.event_name == 'workflow_dispatch' && inputs.only || '' }}
    secrets: inherit
