name: bump-stack-submodules

# Phase 0 / ADR-0008 — the submodule auto-bump bot.
#
# Weekly (and on demand), advance every stacks/* submodule pointer to its
# remote default-branch HEAD and open ONE PR with the bumped pointers. This
# turns submodule drift into a reviewable PR instead of a silent footgun (the
# stale-pointer trap we hit by hand), and removes the manual "second PR" after a
# stack repo merges.
#
# The bump PR itself is gated by validate-shapes.yml (it touches stacks/**), so
# the newly-pinned shapes are validated in the superproject before merge.
#
# Tokens: SUBMODULES_RO_PAT reads the private Homelab.Stacks.* repos to fetch
# their latest HEAD; the default GITHUB_TOKEN (contents+PR write, below) pushes
# the branch + opens the PR on this repo.

on:
  schedule:
    - cron: '0 6 * * 1'      # Mondays 06:00 UTC (~Mon 18:00 NZ) — weekly
  workflow_dispatch: {}

permissions:
  contents: write            # push the bump branch
  pull-requests: write       # open/maintain the bump PR

concurrency:
  group: bump-stack-submodules
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0     # need history to push a branch

      - name: Bump stacks/* submodules to remote HEAD
        id: bump
        env:
          TOKEN: ${{ secrets.SUBMODULES_RO_PAT }}
        run: |
          set -euo pipefail
          # Auth the private submodule fetches via the RO PAT (scoped to this step,
          # then removed so the later push uses the checkout's GITHUB_TOKEN creds).
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          paths=$(git config --file .gitmodules --get-regexp path | awk '{print $2}' | grep '^stacks/')
          git submodule update --init $paths
          git submodule update --remote $paths
          git config --global --unset-all url."https://x-access-token:${TOKEN}@github.com/".insteadOf || true
          if git diff --quiet -- $paths; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No stack submodule updates."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Bumped:"; git submodule status $paths
          fi

      - name: Open / update the bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=automation/bump-stack-submodules
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "chore(submodules): bump stacks/* pointers to remote HEAD"
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(submodules): bump stacks/* pointers to remote HEAD" \
              --body "Automated bump of \`stacks/*\` submodule pointers to each repo's default-branch HEAD (ADR-0008 auto-bump bot). Review the pointer diffs, confirm validate-shapes is green, then merge to compose the latest stack changes into the superproject."
          else
            echo "An open bump PR already exists for $BRANCH — updated its branch."
          fi
